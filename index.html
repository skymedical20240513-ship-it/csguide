  --amber:#C97E12; --amber-soft:#FCEFD9;
  --ok:#2E7A55; --ok-soft:#E1F2E8; --ng:#B83E35; --ng-soft:#FBE6E3;

  --rule:#E2EAF4; --chkline:#B2C3DA; --chkOff:#C5CAD2; --chkOn:#D7322A;                 /* β1.6.63：区切りの細い線（枠より弱い） */
  --r-s:6px; --r-m:10px; --r-l:12px;   /* β1.6.63：角丸は3段階だけ（小さな部品／ボタン／まとまり） */
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{
  margin:0; background:linear-gradient(180deg,var(--bgTop) 0,var(--bg) 560px) no-repeat,var(--bg); color:var(--ink);   /* β1.6.65：上ほど空の色が少し濃い */
  font-family:"BIZ UDGothic","BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  font-size:18px; line-height:1.7; -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible, input:focus-visible, select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.hidden{display:none !important}

/* ヘッダー */
header{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
  background:var(--head); color:var(--onHead);
  display:flex; align-items:center; gap:12px; padding:10px 16px;
}
header h1{font-size:18px;margin:0;flex:1;line-height:1.3;font-weight:700;letter-spacing:.04em}
header .ver{font-size:11px;opacity:.55;white-space:nowrap;letter-spacing:.02em;font-family:var(--fnum);font-weight:500}
header .gear{background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:8px;padding:4px 10px;font-size:14px}

.demo{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#FFF3C4;color:var(--ink);font-size:14px;padding:8px 14px;border-bottom:2px solid #E0B400}
.demo button{flex:none;border:1.5px solid #B08A00;background:#fff;border-radius:8px;padding:6px 10px;font-size:14px;color:var(--ink)}
.proto{background:var(--amber-soft);color:var(--ink);font-size:14px;padding:8px 14px;border-bottom:1px solid var(--line)}
main{max-width:640px;margin:0 auto;padding:16px 14px 40px}

/* もどるボタン */
header .back{background:var(--onHead);color:var(--head);border:0;border-radius:var(--r-s);padding:6px 13px;font-size:17px;font-weight:700;white-space:nowrap}
.bottomback{margin-top:24px}
details.guide{background:var(--surface);border:1px solid transparent;border-radius:var(--r-l);margin-bottom:14px}
details.guide > summary{list-style:none;cursor:pointer;padding:14px 16px;font-size:19px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.guide > summary::-webkit-details-marker{display:none}
details.guide > summary::after{content:"開く";font-size:14px;font-weight:700;color:var(--deep);border:1.5px solid var(--deep);border-radius:var(--r-s);padding:1px 10px;flex:none}
details.guide[open] > summary::after{content:"閉じる"}
details.guide .gbody{padding:0 16px 16px}
.steps{list-style:none;margin:0;padding:0;counter-reset:st}
.steps li{counter-increment:st;position:relative;padding:4px 0 12px 46px;min-height:40px}
.steps li::before{content:counter(st);position:absolute;left:0;top:2px;width:34px;height:34px;border-radius:50%;background:var(--deep);color:var(--onDeep);font-weight:700;display:flex;align-items:center;justify-content:center}
.bottle{display:block;width:150px;margin:4px auto 12px}
.vwrap{margin:4px 0 6px}
.gos{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gos .go{margin-top:0}
.daytabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:4;background:var(--bg);padding:6px 0}
.daytabs button{position:relative;border:1.5px solid transparent;background:var(--surface);border-radius:var(--r-m);padding:10px 2px 8px;line-height:1.3;display:flex;flex-direction:column;align-items:center;gap:2px}
.daytabs button b{font-size:min(15px,3.6vw);white-space:nowrap;letter-spacing:-.03em}   /* β1.6.42：「検査当日」が狭いスマホでも収まるように */
.daytabs button .dd{font-size:21px;font-weight:600;line-height:1.1;white-space:nowrap;letter-spacing:-.02em;font-family:var(--fnum)}
.daytabs button small{font-size:12px;color:var(--sub);white-space:nowrap}
.daytabs{align-items:end}
.daytabs button{min-height:86px;justify-content:center}
.daytabs button[aria-selected="true"]{min-height:104px}
.daytabs button[aria-selected="true"]{background:var(--deep);border-color:var(--deep);color:var(--onDeep);padding:14px 2px 10px;box-shadow:none}
.daytabs button[aria-selected="true"] b{font-size:min(19px,5vw)}
.daytabs button[aria-selected="true"] .dd{font-size:30px}
.daytabs button[aria-selected="true"] small{color:var(--onDeep);opacity:.9;font-size:14px}
.daytabs button.prevday{background:#E3EEFA;border-color:#9CC0E8;color:#1F4E8C}   /* β1.6.52：検査前日・当日のタブは青系統 */
.daytabs button.prevday small{color:#1F4E8C}
.daytabs button.prevday[aria-selected="true"]{background:#3A7DC9;border-color:#3A7DC9;color:#fff}
.daytabs button.prevday[aria-selected="true"] small{color:#fff}
.daytabs button.examday{background:#DAE4F8;border-color:#7F9DDB;color:#173F8F}
.daytabs button.examday small{color:#173F8F}
.daytabs button.examday[aria-selected="true"]{background:#22489E;border-color:#22489E;color:#fff}
.daytabs button.examday[aria-selected="true"] small{color:#fff}
/* β1.6.67：3日前・2日前のタブは、選んでも色を反転させない（白い地のまま、青い枠で選んでいることを示す） */
.daytabs button.early[aria-selected="true"]{background:var(--surface);color:var(--ink);border:2px solid var(--deep);padding:13.5px 1.5px 9.5px}
.daytabs button.early[aria-selected="true"] small{color:var(--sub);opacity:1}
.daytabs .tdy{position:absolute;top:-15px;left:50%;transform:translateX(-50%);background:#E53935;color:#fff;font-style:normal;font-size:15px;font-weight:700;border:2px solid #fff;border-radius:999px;padding:0 12px;line-height:24px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.22);z-index:1}   /* β1.6.54：今日マークを大きく・赤で目立つように */
.daytabs{padding-top:16px}
.daytabs button:has(.tdy){padding-top:18px}   /* β1.6.54：今日マークと「検査前日」などの文字が重ならないように */   /* β1.6.54：大きくした今日マークが上にはみ出さないように */
.daynav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.daynav .btn{font-size:17px;padding:12px 8px}
.daynav .btn + .btn{margin-top:0}
.ptot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:15px;margin-bottom:8px}
.ptot .lg{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.ptot .lg.m{background:var(--mobi)} .ptot .lg.w{background:var(--water)}
.half{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.half .hl{font-size:14px;font-weight:700;color:var(--sub)}
.half .cups{justify-content:flex-start;margin:6px 0 2px}
.half .cups span.m{border-color:var(--mobi)}
.half .cups span.w{border-color:var(--water)}
.half .cups span.now{border-color:var(--amber);border-width:3px}
.cups.one{justify-content:space-between;flex-wrap:nowrap;gap:2px;margin:8px 0 4px}
.cups.one span{width:auto;flex:1 1 0;max-width:22px;height:26px;border-width:2px}
.cups.one .divider{flex:0 0 4px;width:4px;max-width:4px;height:34px;margin:-4px 2px 0;border-width:0;border-radius:2px;background:var(--amber)}
.cups.one .divider.ok{background:var(--ok)}
.cups.one span.m{border-color:var(--mobi)} .cups.one span.w{border-color:var(--water)}
.cups.one span.now{border-color:var(--amber);border-width:3px}
.segs{display:flex;align-items:flex-end;gap:4px;margin:8px 0 4px}
.seg{flex:1 1 0;min-width:0}
.seg .sl{line-height:1.25;margin-bottom:4px}
.seg .sl b{display:block;font-size:14px}
.seg .sl small{display:block;font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg .cups.one{margin:0}
.segs > .divider{flex:0 0 4px;width:4px;height:44px;border-radius:2px;background:var(--amber);align-self:flex-end}
.segs > .divider.ok{background:var(--ok)}
.seg.extra .sl b{color:var(--sub)}
.seg.extra:not(.on) .cups span{border-style:dashed;opacity:.6}
.seg.extra.on .sl b{color:var(--ink)}
.btn.toilet{background:var(--surface);color:var(--deep);border:2px solid var(--deep);margin-top:10px}
.stool.big button .sw{height:56px}
.slog{list-style:none;margin:0 0 4px;padding:0}
.slog li{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--rule);font-size:16px}
.slog li:first-child{border-top:0}
.slog li span{width:52px;color:var(--sub);font-variant-numeric:tabular-nums}
.slog li i{width:28px;height:20px;border-radius:4px;border:1px solid var(--line)}
.slog li b{font-weight:400}
.slog li.del{color:var(--sub)}
.slog li.del b, .slog li.del span{text-decoration:line-through}
.slog li.del i{opacity:.4}
.slog li.del small{font-size:13px;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.chkpt{text-align:center;font-weight:700;font-size:15px;color:var(--amber);margin:6px 0}
.chkpt.ok{color:var(--ok)}
.stage{display:flex;align-items:center;gap:12px;border-radius:12px;padding:12px 14px;margin:10px 0;font-size:18px;line-height:1.5;background:var(--sky)}
.stage .mark{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#fff;background:var(--deep)}
.stage.ok{background:var(--ok-soft);color:var(--ok)} .stage.ok .mark{background:var(--ok)}
.stage.ng{background:var(--ng-soft);color:var(--ng)} .stage.ng .mark{background:var(--ng)}
.stage.go{background:var(--amber-soft);color:var(--ink)} .stage.go .mark{background:var(--amber)}
.pick{display:flex;align-items:center;gap:10px;font-weight:700;margin:6px 0 10px}
.pick span{width:44px;height:30px;border-radius:6px;border:1px solid var(--line)}
.say{font-size:19px;line-height:1.7}
.donebox{background:var(--surface);border:2px solid var(--ok);border-radius:12px;padding:12px 14px;font-size:18px}
.donebox .arr{margin:0;text-align:center;font-size:24px;font-weight:700;line-height:1.5}
.donebox .arr b{display:block;font-size:42px;line-height:1.2;color:var(--deep);font-family:var(--fnum);font-weight:600}
.guidebtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:14px}
.guidebtns button{background:var(--surface);border:1.5px solid var(--deep);border-radius:var(--r-m);padding:10px 4px;font-size:22px;line-height:1.3;display:flex;flex-direction:column;align-items:center;gap:4px}
.guidebtns button span{font-size:15px;font-weight:700;color:var(--deep)}
.vlink{display:block;text-decoration:none;color:var(--ink);border:1.5px solid var(--deep);border-radius:var(--r-l);overflow:hidden;margin:4px 0 10px;background:var(--surface)}
.vthumb{display:block;position:relative;aspect-ratio:16/9;background:#000 center/cover no-repeat}
.vthumb .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;padding-left:5px}
.vcap{display:block;padding:10px 12px;font-size:15px;line-height:1.5}
.vcap b{display:block;font-size:18px;color:var(--deep)}
.vcap .vnote{display:block;font-weight:700;color:var(--amber);margin-top:2px}
.vcap small{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.drinks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.drinks > div{border-radius:12px;padding:10px 12px;font-size:15px}
.drinks .hd{font-weight:700;margin-bottom:4px}
.drinks ul{margin:0;padding-left:1.1em}
.okbox{background:var(--ok-soft)} .okbox .hd{color:var(--ok)}
.ngbox{background:var(--ng-soft)} .ngbox .hd{color:var(--ng)}
.stoplist.cols{columns:2;column-gap:20px}
.caution{border:1.5px solid var(--ng);border-radius:var(--r-m);padding:10px 12px 12px;margin:10px 0;font-size:16px}
.caution .ch{display:inline-block;background:var(--ng);color:#fff;font-size:13px;font-weight:700;border-radius:999px;padding:1px 10px;margin-bottom:4px}
.caution b{display:block;font-size:18px;margin-bottom:2px}
.caution .to{color:var(--ng);font-weight:700;margin-top:4px}
.halfwarn{background:var(--ng-soft);border:1.5px solid var(--ng);border-radius:var(--r-m);padding:12px 14px;margin:10px 0;font-size:16px}
.halfwarn b{display:block;color:var(--ng);font-size:19px}
.vwrap video{display:block;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px}
.vsrc{font-size:12px;color:var(--sub);margin-top:4px}
.rule{border-left:5px solid var(--deep);padding:4px 0 4px 12px;margin:0 0 12px}
.rule b{display:block;font-size:19px}
.stoplist{margin:6px 0 10px;padding-left:1.2em}
.subh{font-weight:700;margin:16px 0 6px}
.summary{display:flex;justify-content:space-between;align-items:center;gap:12px}
.panel.summary{position:relative;isolation:isolate;background:linear-gradient(180deg,var(--head) 0%,var(--skyLow) 100%);color:var(--onHead);border:0;border-radius:0;margin:-16px -14px 12px;padding:4px 18px 40px;align-items:flex-end;overflow:hidden}   /* β1.6.64：検査日は上の帯から続く欄に。β1.6.65：濃い空から明るい空へ */
.panel.summary::before{content:"";position:absolute;z-index:-1;right:-26px;top:4px;width:420px;height:160px;background:var(--skyArt) right top/contain no-repeat;pointer-events:none}   /* β1.6.68：うすい雲を少し増やした（暗い表示は夜空のうすい雲） */
.panel.summary > *{position:relative}
.panel.summary::after{content:"";position:absolute;z-index:-1;left:-10px;right:-10px;bottom:-1px;height:30px;pointer-events:none;background:radial-gradient(circle at 46px 40px,var(--bgTop) 30px,transparent 31px) -12px 0/112px 30px repeat-x,radial-gradient(circle at 22px 30px,var(--bgTop) 16px,transparent 17px) 30px 0/78px 30px repeat-x}   /* β1.6.65：下のふちを雲の形に（空から地面へ） */
@media (min-width:670px){.panel.summary{border-radius:0 0 var(--r-l) var(--r-l)}}
.summary .dl{display:block;font-size:14px;font-weight:700;color:var(--headSub);letter-spacing:.08em;margin-bottom:2px}
.summary .d{font-size:28px;font-weight:700;line-height:1.3;letter-spacing:.02em;font-family:var(--fnum)}
.summary .p{font-size:16px;color:var(--headSub);margin-top:4px}
.summary button{flex:none;background:transparent;border:1.5px solid rgba(255,255,255,.7);color:var(--onHead);font-weight:700;border-radius:var(--r-s);padding:6px 14px;font-size:16px}
.day.istoday .timeline{border:2px solid var(--amber)}


/* 共通 */
h2{font-size:22px;margin:4px 0 14px;line-height:1.4;letter-spacing:.02em}
h3{font-size:19px;margin:0 0 8px;line-height:1.4}
p{margin:0 0 10px}
.muted{color:var(--sub);font-size:15px}
.panel{background:var(--surface);border:1px solid transparent;border-radius:var(--r-l);padding:16px;margin-bottom:14px}
.btn{
  display:block;width:100%;border:0;border-radius:var(--r-m);padding:14px 16px;font-size:19px;font-weight:700;
  background:var(--deep);color:var(--onDeep);text-align:center;
}
.btn.sub{background:var(--sky);color:var(--deep);font-weight:700;font-size:17px}
.btn.warn{background:var(--ng-soft);color:var(--ng);border:1.5px solid var(--ng)}
.btn + .btn{margin-top:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* 初期設定 */
.setup label{display:block;font-weight:700;margin:14px 0 6px}
/* 検査日のカレンダー（スマホ標準のカレンダーは「リセット」が出るため自作） */
.cal{border:1px solid transparent;border-radius:var(--r-l);background:var(--surface);padding:8px}
.cal .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal .ch b{font-size:18px}
.cal .ch button{width:48px;height:44px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);font-size:22px;color:var(--ink)}
.cal .ch button:disabled{opacity:.3}
.cal .cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .wd{font-size:13px;color:var(--sub);padding:2px 0}
.cal .wd.su,.cal .cd.su{color:var(--ng)}
.cal .wd.sa,.cal .cd.sa{color:#2F6FB0}
.cal .cd{height:44px;border:0;border-radius:var(--r-s);font-variant-numeric:tabular-nums;font-family:var(--fnum);background:transparent;font-size:18px;color:var(--ink);padding:0}
.cal .cd:disabled{opacity:.3}
.cal .cd.td{box-shadow:inset 0 0 0 2px var(--line)}
.cal .cd.sel{background:var(--deep);color:#fff;font-weight:700}
.calsel{margin-top:8px;font-size:18px;font-weight:700;text-align:center}
.calsel.none{color:var(--sub);font-weight:400;font-size:15px}
.choice{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:14px 10px;text-align:center;font-size:18px;line-height:1.4}
.choice small{display:block;color:var(--sub);font-size:14px}
.choice[aria-pressed="true"]{border:2px solid var(--deep);background:var(--sky);font-weight:700;padding:13.5px 9.5px}

/* スケジュール（日ごとの時間割） */
.day{margin-bottom:22px}
.dayhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.dayhead .when{font-size:21px;font-weight:700}
.dayhead .tag{font-size:21px;font-weight:700;background:var(--sky);border-radius:999px;padding:2px 14px}   /* β1.6.39：日付を大きく（見出しと同じ大きさ） */
.dayhead .today{background:var(--amber);color:#fff;font-size:16px}
.prebtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--amber-soft);border:1.5px solid var(--amber);border-radius:var(--r-l);padding:12px 14px;margin:0 0 14px;color:var(--ink);font-size:16px}
.prebtn b{display:block;font-size:18px}
.prebtn small{display:block;font-size:14px;color:var(--sub)}
.prebtn .pi{flex:none;width:32px;height:32px;border-radius:50%;background:var(--amber);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:18px}
.prebtn .pa{margin-left:auto;font-size:24px;color:var(--amber)}
.prebtn.ok{background:var(--ok-soft);border-color:var(--ok)}
.prebtn.ok .pi{background:var(--ok)}
.prebtn.ok .pa{color:var(--ok)}
.flow{background:var(--surface);border:1px solid transparent;border-radius:var(--r-l);overflow:hidden;margin-bottom:10px}
.flow .fh{background:var(--deep);color:var(--onDeep);font-weight:700;padding:6px 12px}
.flow .fl{display:grid;grid-template-columns:76px 1fr;gap:8px;padding:10px 12px;border-top:1px solid var(--rule)}
.flow .fh + .fl{border-top:0}
.flow .fl.key{background:var(--amber-soft);box-shadow:inset 4px 0 0 var(--amber)}
.flow .ft{font-weight:600;color:var(--deep);font-variant-numeric:tabular-nums;font-family:var(--fnum)}
.flow .dt{font-size:15px;color:var(--sub);margin-top:2px}
.flow .ttl{font-weight:700}
#vBefore .btabs{position:static;margin-bottom:14px}
#vBefore .btabs button{padding:12px 2px}
#vBefore .btabs{padding:0;align-items:stretch;gap:0 !important;border:1.5px solid var(--deep);border-radius:var(--r-m);overflow:hidden}   /* β1.6.63：①②は高さをそろえた切り替えに */
#vBefore .btabs button, #vBefore .btabs button[aria-selected="true"]{min-height:56px;border:0;border-radius:0;padding:10px 4px}
#vBefore .btabs button + button{border-left:1.5px solid var(--deep)}
#vBefore .btabs button b, #vBefore .btabs button[aria-selected="true"] b{font-size:17px}
#vBefore .gos{display:flex;flex-wrap:wrap;gap:8px}
#vBefore .go{display:inline-block;background:var(--surface);color:var(--deep);border:1.5px solid var(--deep);border-radius:var(--r-s);padding:6px 14px;font-size:15px;font-weight:700}
.timeline{background:var(--surface);border:1px solid transparent;border-radius:var(--r-l);overflow:hidden}
.item{position:relative;display:grid;grid-template-columns:60px 1fr;gap:8px 10px;padding:13px 10px 13px 8px;border-top:1px solid var(--rule);align-items:start}
.item::before{content:"";position:absolute;left:73px;top:0;bottom:0;width:1px;background:var(--rule)}   /* β1.6.63：時刻の列と内容の間に縦の細い線（時刻を目印に読めるように） */
.item.wide::before{display:none}
.item:first-child{border-top:0}
.item .t{font-weight:600;font-size:19px;color:var(--deep);line-height:1.45;font-variant-numeric:tabular-nums;letter-spacing:0;text-align:center;white-space:nowrap;font-family:var(--fnum)}   /* β1.6.83：列を72→60pxに狭く、真ん中ぞろえ */
.item .t.long{font-size:13px;letter-spacing:-.05em}   /* β1.6.83：5文字以上（「アンケート」など）は少し小さく */
.item .t.soft{font-family:inherit}
.item .t.soft{font-size:14px;font-weight:700;color:var(--sub);padding-top:3px}
.item .ttl{font-weight:700;line-height:1.5}
.item .dt{font-size:16px;color:var(--sub);margin-top:2px}
.item ol{margin:4px 0 0;padding-left:2.1em;font-size:16px}   /* β1.6.84：1. 2. 3. の数字が縦の線に重ならないよう、左の余白を広げた */
.item.key{background:var(--amber-soft);box-shadow:inset 4px 0 0 var(--amber)}
.sv .svq{font-weight:700;font-size:18px;margin-bottom:8px}
.sv .svo{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-m);padding:10px 14px;margin-top:8px;font-size:17px;color:var(--ink)}
.sv .svo[aria-pressed="true"]{border:2px solid var(--deep);padding:9.5px 13.5px;background:var(--sky);font-weight:700}
.sv .svo[aria-pressed="true"]::before{content:'✓ ';color:var(--deep)}
#btnSurveySend:disabled{opacity:.5}
.endbox h2{margin-top:0}
#vEnded .item{grid-template-columns:60px 1fr}
.backtoday{margin:-4px 0 14px;background:#fff;border:2px solid #E8891A;color:#9A4A06;line-height:1.3}   /* β1.6.52：白地にオレンジ枠 */
.backtoday small{display:block;font-size:15px;font-weight:700}
.backtoday b{display:block;font-size:20px}
.practice{background:#EDE7F6;border:2px solid #7E57C2;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:16px}
.practice b{color:#5E35B1}
.practice .linkbtn{display:block;margin-top:6px}
.consent p{margin:0 0 10px}
.consent .demonote{background:var(--amber-soft);border-radius:8px;padding:6px 10px;font-weight:700}
.consent .list{margin:0 0 10px}
#vConsent .btn + .btn{margin-top:10px}
.item .itel{margin-top:8px}
.item .itel .tel{margin:0;font-size:20px;padding:8px 10px;white-space:nowrap}
.item.wide{grid-template-columns:1fr;text-align:center}   /* β1.6.20〜：時刻の欄を使わず、文章で書く項目（β1.6.22：真ん中ぞろえ・チェックなし） */
.item.wide .ttl{font-size:20px}
.timeline:empty{display:none}
.bigwrap{margin:22px 0}
.bigbtn{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:#2A93DB;color:#fff;border-radius:var(--r-l);padding:18px 16px;cursor:pointer;box-shadow:0 4px 0 #1A68A3}   /* β1.6.52：緑に。β1.6.69：スカイブルーに */
.bigbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #1A68A3}
.bigbtn .bt{font-size:26px;font-weight:600;line-height:1.1;font-family:var(--fnum)}
.bigbtn .bttl{font-size:20px;font-weight:700;line-height:1.4}
.bigbtn .bdt{font-size:14px;margin-top:4px;opacity:.95}
.bigbtn .bhint{grid-column:1 / -1;text-align:center}
.bigbtn .bhint small{display:block;margin-top:6px;font-size:14px;font-weight:700;opacity:.95}
.bigbtn .bhint span{display:inline-block;font-size:15px;font-weight:700;border:1.5px solid rgba(255,255,255,.85);border-radius:999px;padding:4px 16px}
@keyframes bigpulse{0%,100%{box-shadow:0 4px 0 #1A68A3,0 0 0 0 rgba(42,147,219,.55)}50%{box-shadow:0 4px 0 #1A68A3,0 0 0 10px rgba(42,147,219,0)}}
.bigbtn{animation:bigpulse 2.2s ease-in-out infinite}
.bigbtn:active{animation:none}
@media (prefers-reduced-motion: reduce){.bigbtn{animation:none}}
.item.ng .ttl{color:var(--ng)}
.item .go{margin-top:8px;display:inline-block;background:var(--surface);color:var(--deep);border:1.5px solid var(--deep);border-radius:var(--r-s);padding:5px 12px;font-size:15px;font-weight:700;line-height:1.4}   /* β1.6.63：説明を開くボタンは白地に枠（主役のボタンと強さを分ける） */
/* β1.6.85：右の丸（済）の列をなくして、項目をタップすると、文字に重なるように大きく「済」の印を出す */
.readchk{display:flex;gap:12px;align-items:flex-start;margin:14px 2px 10px;font-size:16px;line-height:1.5;font-weight:700;cursor:pointer}
.readchk input{width:28px;height:28px;flex:none;margin:0;accent-color:var(--deep)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.consentbtns{display:flex;gap:8px;margin:12px 0 4px;align-items:stretch}.consentbtns .btn{flex:1;margin:0!important;padding:10px 6px;font-size:15px}
.item[data-chk]{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.item.done::after{content:"済";position:absolute;z-index:1;right:14px;top:50%;width:62px;height:62px;margin-top:-31px;box-sizing:border-box;border:4px solid var(--chkOn);border-radius:50%;color:var(--chkOn);font-size:38px;font-weight:700;line-height:54px;text-align:center;opacity:.8;transform:rotate(-10deg);pointer-events:none}
.item.done .ttl,.item.done .dt{opacity:.55}

/* 食事 */
.foodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.food{border-radius:12px;padding:10px 6px;text-align:center;font-size:15px;line-height:1.35}
.food .e{font-size:30px;display:block;line-height:1.2;margin-bottom:2px}
.food small{display:block;font-size:12px;color:var(--sub)}
.ok .food{background:var(--ok-soft)}
.ng .food{background:var(--ng-soft)}
.cat{font-weight:700;margin:14px 0 6px;font-size:16px}
.banner{border-radius:12px;padding:12px 14px;font-weight:700;margin-bottom:12px}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.ng{background:var(--ng-soft);color:var(--ng)}

/* 飲み方ナビ（主役） */
.meter{margin-bottom:10px}
.meter .lab{display:flex;justify-content:space-between;font-size:15px}
.meter .bar{height:12px;border-radius:999px;background:var(--empty);overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:999px;transition:width .4s}
.next{text-align:center;padding:20px 14px}
/* β1.6.51：飲み方ナビ（いま飲む1杯は上のコップの▲で示す・合計は絵の上・「飲み終わったら…」の場所は最初から空けておく） */
#vNav .panel{padding-top:12px;padding-bottom:10px}
#vNav .segs{margin-bottom:14px}
#vNav .segs > .divider{height:32px;margin-bottom:-3px}   /* 線を短くして、コップの高さの真ん中に */
@keyframes cupblink{0%,46%{opacity:1}50%,96%{opacity:.15}100%{opacity:1}}   /* β1.6.53：じわっとではなくパッパと切り替わる点滅に
*/
#vNav .cups.one span.now{animation:cupblink 1.6s linear infinite}   /* いま飲む（飲んでいる）コップを点滅（β1.6.53：間隔を1.1秒→1.6秒にゆっくり） */
@media (prefers-reduced-motion: reduce){#vNav .cups.one span.now{animation:none}}
/* β1.6.80：上のコップの並びを大きく（1列のまま）。飲んでいないコップは中身が入っていて、飲んだら白に */
#vNav .panel{padding-left:10px;padding-right:10px}
#vNav .segs{gap:3px}
#vNav .seg .sl{margin-bottom:4px}
#vNav .seg .sl b{font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden}
#vNav .seg .sl small{font-size:14px;font-weight:700;line-height:1.3}
#vNav .cups.one{gap:2px}
#vNav .cups.one span{max-width:32px;height:32px;border-radius:3px 3px 10px 10px}
#vNav .cups.one span{border:0;background:transparent;border-radius:0}
#vNav .cups.one span svg{display:block;width:100%;height:100%;overflow:visible}
#vNav .cups.one span path{stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#vNav .cups.one span.m path{fill:var(--mobi);stroke:var(--mobi)}
#vNav .cups.one span.w path{fill:var(--water);stroke:var(--water)}
#vNav .cups.one span.done path{fill:var(--surface)}
#vNav .cups.one span.now path{stroke:var(--amber);stroke-width:3}
#vNav .seg.extra:not(.on) .cups span{opacity:.45}
#vNav .segs > .divider{height:38px;margin-bottom:-3px}
#vNav .ghost{visibility:hidden}
#vNav .next{padding:4px 4px 2px}
#vNav .ntot{display:flex;justify-content:center;gap:18px;font-size:15px;color:var(--sub);margin:0 0 2px}
#vNav .ntot span{white-space:nowrap}
#vNav .ntot b{display:inline;color:var(--ink);font-size:17px;margin:0 1px}
#vNav .ntot .lg{display:inline-block}
#vNav .ntot .lg{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
#vNav .ntot .lg.m{background:var(--mobi)} #vNav .ntot .lg.w{background:var(--water)}
#vNav .cupbig{width:100%;max-width:300px;margin:12px auto 14px}   /* β1.6.56：絵を画面の幅いっぱいまで大きく。β1.6.59：「押し間違えたので1つ戻す」まで1画面に入るよう、上下の余白を少しだけ詰める */
#vNav .next .big{font-size:22px;margin:4px 0 0;line-height:1.25}   /* β1.6.55：絵との間を少しあける */
#vNav .next .slowsay{font-size:15px;margin:8px 0 0;line-height:1.35;letter-spacing:-.02em}
#vNav .count{font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums;font-family:var(--fnum);font-weight:600}
#vNav .count small{display:inline;font-size:15px;margin-right:6px}
#vNav .count.wsay{font-family:inherit;font-size:clamp(14px,calc((100vw - 84px) / 16.5),20px);font-weight:700;color:var(--deep);white-space:nowrap;line-height:37px}   /* β1.6.70：時計（34px）と同じ高さ */
#vNav .pace{font-size:15px;margin:0 0 2px;height:1.5em;line-height:1.5em;letter-spacing:-.02em;white-space:nowrap}
#vNav .next .btn{padding:11px 8px;font-size:19px;margin-top:6px}
#vNav .navrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
#vNav .navrow .btn{margin:0;padding:9px 4px;font-size:16px;line-height:1.3;border-width:2px}
#vNav .linkbtn{margin-top:6px}
.next .what{font-size:17px;color:var(--sub)}
.next .slowsay{font-size:19px;font-weight:700;color:var(--deep);margin:6px 0 2px}
.inlink{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--deep);text-decoration:underline;cursor:pointer}
#stoolLog{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 64px)}
.howto{background:var(--sky);border-radius:12px;padding:10px 14px;font-size:16px;margin-bottom:14px}
.howto summary{font-weight:700;cursor:pointer;color:var(--deep)}
.howto[open] summary{margin-bottom:6px}
.next .big{font-size:26px;font-weight:700;margin:2px 0 6px;line-height:1.4}
.cupbig .liq{transform-box:fill-box;transform-origin:50% 100%}
.cupbig .liq.drain{animation-name:drain;animation-timing-function:linear;animation-fill-mode:forwards}
/* 1分ごとに1段ずつ減る（段の数はコップを空にする時間〔分〕。style で steps(n) を指定） */
@keyframes drain{from{transform:scaleY(1)}to{transform:scaleY(.03)}}
.count small{display:block;font-size:15px;font-weight:400;color:var(--sub);line-height:1.2}
.pace{font-size:17px;color:var(--sub);margin:4px 0 10px;min-height:1.6em}
.pace.ok{color:var(--ok);font-weight:700}
.cupbig{width:240px;max-width:100%;height:auto;margin:6px auto 4px;display:block}
.count{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;margin:6px 0}
.count.ready{color:var(--ok);font-size:30px}
.next.alarm{animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{background:var(--amber-soft)}}
@media (prefers-reduced-motion: reduce){.next.alarm{animation:none;background:var(--amber-soft)}.meter .bar i{transition:none}}
.cups{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 4px}
.cups span{width:22px;height:28px;border-radius:3px 3px 8px 8px;border:2px solid var(--line);background:var(--surface)}
.cups span.m.done{background:var(--mobi);border-color:var(--mobi)}
.cups span.w.done{background:var(--water);border-color:var(--water)}
.cups span.now{border-color:var(--amber);border-width:3px}
.legend{display:flex;gap:14px;justify-content:center;font-size:13px;color:var(--sub)}
.legend b{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.linkbtn{background:none;border:0;color:var(--sub);text-decoration:underline;font-size:15px;padding:6px}
.stool{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.stool button .sn{display:block;font-size:11px;font-weight:700;color:var(--sub);margin-top:3px;white-space:nowrap}
.stool button .sn.ok{color:var(--ok)}
.stool button{border:1.5px solid var(--line);border-radius:var(--r-s);padding:0 0 6px;background:var(--surface);font-size:13px;line-height:1.3;overflow:hidden}
.stool button .sw{display:block;height:44px;margin-bottom:4px;align-self:stretch}
.stool button{display:flex;flex-direction:column;align-items:center;justify-content:flex-start}   /* β1.6.62：文字の行数がちがっても、色の見本がいつも上にそろうように（②だけ下にずれていた） */
.stool button br{display:none}   /* 縦に並べるので改行は不要 */
.stool button .n{font-weight:700;font-size:16px}
.stool button.last{border-color:var(--deep);border-width:3px}
.finish{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px 14px;font-weight:700;margin-top:10px}
.note{background:var(--sky);border-radius:12px;padding:12px 14px;font-size:16px;margin-bottom:14px}

/* 検査後・Q&A */
.list{margin:0;padding-left:1.2em}
.list li{margin-bottom:8px}
.qa{border-top:1px solid var(--rule);padding:12px 0}

<script>
/* =========================================================
   大腸カメラ検査のご案内（患者用アプリ）  CSGUIDE
   ---------------------------------------------------------
   ★ 下の SETTINGS_URL に、設定用GASのウェブアプリURLを貼ってください（最初に1回だけ）。
      設定（時刻・量・文章など）は「院内アプリ」で変更します。このファイルは書き換え不要です。

const SETTINGS_URL = 'https://script.google.com/macros/s/AKfycbzXTV9azDiKen8sN-_i34qIzseZAs-qZ1qc2zC9z0LoKDCmLetB0QzaUwVsQks4PfyqYA/exec';
const APP_VERSION = 'β1.6.98';   // 3つのアプリで1本の通し番号（このファイルは、中身を直したときだけ新しい版になる）

// 設定の初期値（スプレッドシートに設定がないとき・読み込めないときに使う）
const DEFAULT_CONFIG = {
  prototype: true,                 // 試作版の注意書きを出す
  phone: '000-000-0000',           // 困ったときの連絡先

  dietDaysBefore: 3,               // 何日前から消化の良い食事にするか
  dinnerBy: '19:00',               // 前日の夕食はここまで
  prevDayMeds: [                   // 前日の下剤
    { time:'20:00', title:'ピコスルファート（液体の下剤）を1本飲む',
      steps:['ピコスルファート1本を、コップ1杯（200mL）以上の水に入れて飲む','さらに水かお茶を1杯飲む'] },
    { time:'21:00', title:'センノシド（錠剤の下剤）を3錠飲む',
      steps:['センノシド3錠を、コップ1杯以上の水で飲む','さらに水かお茶を1杯飲む'] },
    { time:'寝る前', title:'水かお茶をコップ1杯飲む', steps:[] }

  arriveBeforeExam: 30,            // 自宅で飲む人：来院は検査の何分前か（検査時間が分かるとき。飲み始めも同じだけずらす）
  clinic: { arrive:'08:50', start:'09:00' },   // 院内で飲む人（β1.6.88：来院8:50・飲み始め9:00ごろ。飲み方ナビも使える）

  method: '2-1',                   // 標準の飲み方（QRコードで指定がないとき）

  },
  mobiTotalMl: 2000,               // モビプレップの総量
  extraMobiMl: 500,                // 「必ず飲む」分で④⑤にならず便が出ているとき、追加で飲むモビプレップの量
  mobiCupMl: 200,                  // 1杯の量（スタンダード法）
  waterAfterEachMl: 1000,          // モビプレップをこの量飲むごとに
  waterMl: 500,                    //   水かお茶をこの量
  waterCupMl: 250,                 //   水・お茶の1杯の量
  slowCups: 3,                     // はじめの何杯をゆっくり飲むか
  slowMin: 15,                     //   その間隔（分）
  intervalMin: 10,                 // それ以降の1杯ごとの間隔（分）
  tooFastMin: 5,                   // 前の1杯からこの時間（分）以内にモビプレップを飲んだら「速すぎる」と警告
  clearLevel: 4,                   // この段階以上（④うすい黄・⑤透明）なら終了
  minStools: 5,                    // β1.6.89：必ず飲む分を飲み終えたとき、終了にするのに最低限必要な排便の回数
  okDrinks: ['水（ミネラルウォーターも可）','お茶（煎茶・麦茶・ウーロン茶など）','紅茶（砂糖・ミルクなし）'],
  ngDrinks: ['スポーツドリンク','乳製品（牛乳・飲むヨーグルトなど）','ジュース','アルコール','砂糖や粒などが入った飲み物'],
  thirstRule: 'のどが渇いたら、決められた量とは別に水やお茶を飲んでかまいません。ご高齢の方や脱水に注意が必要な方は、積極的に飲みましょう。',
  beforeRule: '前回の排便が2日以上前（便秘）、または下痢が続いている場合は、モビプレップを飲む前に当院へ連絡してください。',   // 服用時の注意点のページ
  beforeCheck: '前回の排便が2日以上前（便秘）、または下痢が続いている場合は、前日のピコスルファートやセンノシド、当日のモビプレップを飲む前に当院へ連絡してください。',   // 前日のチェック項目（β1.6.0〜）
  halfRule: 'モビプレップを半分（約1L）飲んだところで、まだ一度も便が出ていない場合は、飲むのをいったんやめて当院へ連絡してください。',

  ],

  ],

  // メーカー（EAファーマ）公式の患者さま向け動画ページ
  videos: {
    '2-1': {

      drink:   { title:'準備＋服用編（2杯1杯法）', len:'4分41秒', url:'https://www.eapharma.co.jp/patient/moviprep/how-to-prevention-of-dehydration/video/dissolve-and-drink-anime', note:'飲み方の説明は、動画の3分ごろからです' },

      drink:   null,

    },

// 初期値に、スプレッドシートの設定を重ねる
function mergeCfg(base, over){
  if(over === undefined || over === null) return base;
  if(typeof over !== 'object' || Array.isArray(over) || typeof base !== 'object' || Array.isArray(base) || base === null) return over;
  const out = Object.assign({}, base);
  Object.keys(over).forEach(k => { out[k] = mergeCfg(base[k], over[k]); });
  return out;
}
const CFG_CACHE = 'csguide_cfg_v1';
let CONFIG = DEFAULT_CONFIG;
try{ const c = localStorage.getItem(CFG_CACHE); if(c) CONFIG = mergeCfg(DEFAULT_CONFIG, JSON.parse(c)); }catch(e){}
// スプレッドシート（GAS）から最新の設定を読み込む。読めないときは前回の設定（なければ初期値）で動く
async function loadRemoteConfig(){
  if(!SETTINGS_URL) return;
  try{
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 6000);
    const r = await fetch(SETTINGS_URL + (SETTINGS_URL.includes('?') ? '&' : '?') + 'action=get&t=' + Date.now(), { signal:ctl.signal });
    clearTimeout(tm);
    const j = await r.json();
    if(j && j.ok && j.config && typeof j.config === 'object'){
      CONFIG = mergeCfg(DEFAULT_CONFIG, j.config);
      try{ localStorage.setItem(CFG_CACHE, JSON.stringify(j.config)); }catch(e){}
    }
  }catch(e){}
}

/* ---------- 保存（この端末の中だけ） ---------- */

// β1.6.66：スタッフ評価版（?eval=1）。お試し版と同じく記録は送らず、評価シートだけを送る
const EVAL = new URLSearchParams(location.search).get('eval') === '1';
const DEMO = EVAL || new URLSearchParams(location.search).get('demo') === '1';
const KEY = EVAL ? 'csguide_eval_v1' : DEMO ? 'csguide_demo_v1' : 'csguide_state_v1';
const blankState = () => ({ date:'', examTime:'', schedAt:0, cancelled:false, place:'', checks:{}, drinks:[], stools:[], delStools:[], nextAt:0, stopMobi:false, allDone:false, checkDone:false, noStool:false, callAck:false, curDone:false, baseOK:false, baseCall:'', extraCall:false, extraAck:false, lastWaterInProg:false, code:'', method:'', updatedAt:0 });
let S = blankState();
function load(){ try{ const v = localStorage.getItem(KEY); if(v) S = Object.assign(S, JSON.parse(v)); }catch(e){} }
// β1.6.92：評価版（スタッフ評価）では、仮の番号（EV＋5文字。本番の番号は6文字なので重ならない）で記録を院内アプリへ送る。「デモの記録」として別に表示される
const evCode = () => 'EV' + Array.from({length:5}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
function save(){ if(PRACTICE) return;   // β1.6.35：練習のときは保存も送信もしない
  if(EVAL && !/^EV[A-Z0-9]{5}$/.test(S.code || '')) S.code = evCode();
  S.updatedAt = Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} scheduleSync(); }

let syncTimer = null;
// β1.6.26：記録を当院へ送るのは、記録の取り扱いに同意した人だけ
// β1.6.33：検査日の翌日からは「検査のあと」の画面だけ（過ごし方・連絡先はずっと、アンケートは検査日から7日まで）
const SURVEY_DAYS = 7;
const ymdOf = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
const isEnded = () => !DEMO && !S.cancelled && /^\d{4}-\d{2}-\d{2}$/.test(S.date || '') && ymdOf(new Date()) > S.date;
const surveyUntil = () => ymdOf(addD(parseD(S.date), SURVEY_DAYS));
const surveyOpen = () => !isEnded() || ymdOf(new Date()) <= surveyUntil();
const consentOK = () => S.consent === true;
const needConsent = () => (DEMO || !!S.code) && S.consent !== true && S.consent !== false && !isEnded();   // β1.6.27：お試し版でも同意の画面を出す（お試し版は何も送らない）
function scheduleSync(){ if((DEMO && !EVAL) || !SETTINGS_URL || !S.code || !consentOK() || isEnded()) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 800); }
function stageText(){
  const i = S.drinks.length;
  if(S.allDone) return '終了';
  if(S.stopMobi) return '最後の水・お茶';
  if(pastBase() && !baseJudged()) return '便の記録待ち';
  if(S.baseCall && !S.callAck) return S.baseCall === 'pain' ? '腹痛・吐き気（電話の案内中）' : '便が出ない（電話の案内中）';
  if(pastExtra() && S.extraCall && !S.extraAck) return '追加後も④⑤にならず（電話の案内中）';
  if(i === 0) return S.date ? '飲み始め前' : '未設定';
  if(!pastBase()) return '必ず飲む分';
  if(!pastExtra()) return '追加分';
  return 'その後（指示あり）';
}
function summaryForStaff(){
  const t = totals(), i = S.drinks.length, done = STEPS.slice(0, i);
  const last = S.stools.length ? S.stools[S.stools.length-1] : null;
  // β1.6.95：飲む場所・飲み方は、QRコードで院内が決めたもの（院内の予定表にある）ので送らない。評価版（予定表がない）だけ送る
  return { date:S.date, examTime:S.examTime || '', schedAt:S.schedAt || 0, place:EVAL ? S.place : '', method:EVAL ? methodLabel() : '',
    mobiCups:done.filter(x=>x.kind==='m').length, waterCups:done.filter(x=>x.kind==='w').length,
    mobiMl:t.m, waterMl:t.w, stools:S.stools.map(x=>x.lv), stoolTimes:S.stools.map(x=>x.t),
    delStools:(S.delStools || []).map(x=>x.lv), delStoolTimes:(S.delStools || []).map(x=>x.t),
    lastLv:last ? last.lv : 0, lastStoolAt:last ? last.t : 0,
    startedAt:S.drinks[0] || 0, lastDrinkAt:S.drinks[i-1] || 0, cancelled:!!S.cancelled, demo:EVAL || undefined, stage: S.cancelled ? '予約取り消し（アプリで案内済み）' : stageText() };
}
function syncNow(){
  sendConsentLog();   // β1.6.98：送れなかった同意の記録があれば、送り直す
  if((DEMO && !EVAL) || !SETTINGS_URL || !S.code || !consentOK() || isEnded()) return;
  clearTimeout(syncTimer);
  let summary = {}; try{ summary = summaryForStaff(); }catch(e){}
  const st = Object.assign({}, S); delete st._pick;
  try{ fetch(SETTINGS_URL, { method:'POST', keepalive:true, body: JSON.stringify({ action:'putPatient', code:S.code, state:st, summary }) }).catch(()=>{}); }catch(e){}
}
// QRコードの番号から、前回までの記録を取り出す（アプリを消してしまっても戻れるように）
async function fetchPatient(code){
  if(DEMO || !SETTINGS_URL) return null;
  try{
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 6000);
    const r = await fetch(SETTINGS_URL + (SETTINGS_URL.includes('?')?'&':'?') + 'action=patient&code=' + encodeURIComponent(code) + '&t=' + Date.now(), { signal:ctl.signal });
    clearTimeout(tm);
    const j = await r.json();
    if(!j || !j.ok) return null;
    return { state: (j.state && typeof j.state === 'object') ? j.state : null, sched: (j.sched && typeof j.sched === 'object') ? j.sched : null };
  }catch(e){ return null; }
}

// 院内（内視鏡カレンダー）で予約が変わったとき：院内アプリがGASに置いた予定を当てはめる
// 戻り値：変わったかどうか
const normTime = t => { const m = /^(\d{1,2}):?(\d{2})$/.exec(String(t || '').trim()); return m && Number(m[1]) < 24 && Number(m[2]) < 60 ? `${Number(m[1])}:${m[2]}` : ''; };
function applySched(sc){
  if(!sc || !/^\d{4}-\d{2}-\d{2}$/.test(sc.date || '')) return false;
  if((sc.at || 0) <= (S.schedAt || 0)) return false;            // もう当てはめた予定
  if(sc.cancelled){                                               // 院内で予約が取り消された
    const was = !!S.cancelled;
    S.cancelled = true; S.schedAt = sc.at || Date.now(); if(!S.date){ S.date = sc.date; S.examTime = normTime(sc.time); }
    return !was;
  }
  const wasCancelled = !!S.cancelled; S.cancelled = false;        // 取り消しが元に戻された
  const time = normTime(sc.time), place = (sc.place === 'home' || sc.place === 'clinic') ? sc.place : S.place;
  const mth = (sc.method && (CONFIG.methods[sc.method] || sc.method === 'standard')) ? sc.method : curMethod();
  const changed = wasCancelled || (!!S.date && (sc.date !== S.date || time !== (S.examTime || '') || place !== S.place || mth !== curMethod()));
  if(sc.date !== S.date || mth !== curMethod()){ RESET_PROGRESS(); }
  S.date = sc.date; S.examTime = time; S.place = place; S.method = mth; S.schedAt = sc.at || Date.now();
  return changed;
}
// β1.6.12：トイレの記録を消したときは、消さずに「取り消し」として残す（取り消し線で表示）
function delStool(x){ if(!x) return; if(!Array.isArray(S.delStools)) S.delStools = []; S.delStools.push({ lv:x.lv, t:x.t, del:Date.now() }); }
function RESET_PROGRESS(){ S.checks = {}; S.drinks = []; S.stools = []; S.delStools = []; S.stopMobi = false; S.allDone = false; S.checkDone = false; S.noStool = false; S.callAck = false; S.curDone = false; S.baseOK = false; S.baseCall = ''; S.extraCall = false; S.extraAck = false; S.lastWaterInProg = false; }
function schedNotice(){

  const arr = S.place === 'home' ? `<p>来院は <b>${homeArrive()}</b>、モビプレップの飲み始めは <b>${homeStart()}</b> です。</p>` : S.place === 'clinic' ? `<p>来院は <b>${CONFIG.clinic.arrive}</b>、モビプレップの飲み始めは <b>${startTime()}</b> ごろです。</p>` : '';
  sh.innerHTML = `<h2>検査の予定が変わりました</h2><p style="font-size:20px"><b>${fmtD(parseD(S.date))}${esc(t)}</b></p>${arr}`

// アプリを開いているときにも、院内で予定が変わっていないか確かめる
async function refreshSched(){
  if(DEMO || PRACTICE || !S.code) return;
  const r = await fetchPatient(S.code);
  if(r && r.sched && applySched(r.sched)){
    S.schedSeen = S.schedAt; save(); rebuild(); selDay = null; closeSheet();
    if(S.cancelled) return resetTo('vCancel');
    resetTo(S.date && S.place ? (['vSetup','vCancel'].includes(current) ? 'vSchedule' : current) : 'vSetup'); schedNotice();
  }
  else if(r && r.sched && (r.sched.at || 0) <= (S.schedAt || 0)){ /* 変わりなし */ }
}

// 予約が取り消されたときの画面（予定・飲み方ナビは出さない）

/* ---------- 日付・時刻 ---------- */
const WD = ['日','月','火','水','木','金','土'];
function parseD(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addD(dt, n){ const x = new Date(dt); x.setDate(x.getDate()+n); return x; }
function fmtD(dt){ return `${dt.getMonth()+1}月${dt.getDate()}日（${WD[dt.getDay()]}）`; }
function sameD(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function addMin(hhmm, m){ const [h,mi] = hhmm.split(':').map(Number); const t = h*60+mi+m; return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`; }
function hm(ts){ const d = new Date(ts); return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 飲む順番（モビプレップと水・お茶） ---------- */
const curMethod = () => (S.method && (CONFIG.methods[S.method] || S.method === 'standard')) ? S.method : CONFIG.method;
const MP = () => CONFIG.methods[curMethod()] || null;
const methodLabel = () => MP() ? MP().label : 'スタンダード法';
function buildSteps(){
  const s = []; let mobi = 0;
  const mp = MP();
  if(mp){
    // モビプレップを決まった杯数飲むごとに水・お茶1杯。区切り（必ず飲む分・追加分）の最後は必ず水・お茶
    const n = Math.round(CONFIG.mobiTotalMl / mp.cup);
    let used = 0, since = 0;
    const addM = () => { used++; const ml = used < n ? mp.cup : CONFIG.mobiTotalMl - mp.cup*(n-1); mobi += ml; s.push({ kind:'m', ml, cum:mobi }); since++; if(since === mp.mobiPerWater){ s.push({ kind:'w', ml:mp.cup, cum:mobi }); since = 0; } };
    const endW = () => { if(s.length && s[s.length-1].kind === 'm'){ s.push({ kind:'w', ml:mp.cup, cum:mobi }); since = 0; } };
    for(let k=0; k<mp.baseCycles*mp.mobiPerWater && used<n; k++) addM();
    endW(); s.base = s.length;
    // 追加分：水・お茶は extraWater 杯（最後の1杯を含む）。途中の水は extraWater-1 杯まで
    const ex = Math.ceil((CONFIG.extraMobiMl || 0) / mp.cup);
    const xw = mp.extraWater > 0 ? mp.extraWater : Math.ceil(ex / mp.mobiPerWater);
    let midW = 0;
    for(let k=0; k<ex && used<n; k++){
      used++; const ml = used < n ? mp.cup : CONFIG.mobiTotalMl - mp.cup*(n-1); mobi += ml; s.push({ kind:'m', ml, cum:mobi }); since++;
      if(since >= mp.mobiPerWater && midW < xw - 1 && k < ex - 1){ s.push({ kind:'w', ml:mp.cup, cum:mobi }); since = 0; midW++; }
    }
    endW(); s.extra = s.length;
    while(used < n) addM();
    endW();
    return s;
  }
  while(mobi < CONFIG.mobiTotalMl){
    const ml = Math.min(CONFIG.mobiCupMl, CONFIG.mobiTotalMl - mobi);
    mobi += ml; s.push({ kind:'m', ml, cum:mobi });
    if(mobi % CONFIG.waterAfterEachMl === 0 || mobi === CONFIG.mobiTotalMl){
      let w = CONFIG.waterMl;
      while(w > 0){ const x = Math.min(CONFIG.waterCupMl, w); s.push({ kind:'w', ml:x, cum:mobi }); w -= x; }
    }
  }
  return s;
}
let STEPS = [];
// n杯飲んだあと、次の1杯までの間隔（分）
const intervalFor = n => n <= CONFIG.slowCups ? CONFIG.slowMin : CONFIG.intervalMin;
const minutesTo = n => { let t = 0; for(let k=1;k<=n;k++) t += intervalFor(k); return t; };
// 時刻 "H:MM" ⇔ 分
const toMin = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || '')); return m ? Number(m[1])*60 + Number(m[2]) : NaN; };
const fromMin = n => `${Math.floor(n/60)}:${String(((n % 60) + 60) % 60).padStart(2,'0')}`;
// 自宅で飲む人の来院時刻：検査時間が分かれば「検査の arriveBeforeExam 分前」、分からなければ共通の時刻
const homeArrive = () => { const e = toMin(S.examTime); return isNaN(e) ? CONFIG.home.arrive : fromMin(e - (Number(CONFIG.arriveBeforeExam) || 30)); };
// 自宅で飲む人の飲み始め（飲み方ごと）。検査時間が分かるときは、来院時刻がずれた分だけ同じようにずらす
const homeStart = () => {
  const base = (MP() && MP().homeStart) || CONFIG.home.start;
  if(isNaN(toMin(S.examTime))) return base;
  return fromMin(toMin(base) + toMin(homeArrive()) - toMin(CONFIG.home.arrive));
};
// β1.6.88：飲み始めの時刻（自宅は検査時間で変わる／院内は決まった時刻）
const startTime = () => S.place === 'clinic' ? (CONFIG.clinic.start || '09:00') : homeStart();
const finishEstimate = () => addMin(startTime(), minutesTo(CHECK_AT));
const extraEstimate  = () => addMin(startTime(), minutesTo(EXTRA_AT));

/* ---------- スケジュール ---------- */

  const days = [];

  // 〇日前〜2日前：1日ずつ別のタブにして、日ごとにチェックできるようにする

    const dt = addD(D, -n);
    days.push({ key:'pre'+n, tab:`${n}日前`, label:fmtD(dt), tag:`検査${n}日前`, date:dt, items:[
      { id:`p${n}_1`, t:'毎食', title:'消化の良いものを食べる', go:'vFood' },
      { id:`p${n}_2`, t:'', title:'お酒はなるべく控える' },

    ]});
  }

  const prev = [

  ];

    { id:'e4', t:'朝', title:'糖尿病の薬・インスリンは使わない', ng:true },
    { id:'e3', t:`${CONFIG.bpMedBy}まで`, title:'血圧の薬を飲んでいる方は飲む', dt:'それ以外の薬は医師の指示に従ってください' },

  if(home){

    day.push({ id:'e5', t:homeStart(), title:'実際にモビプレップを飲み始めましょう', dt:`飲み終わりの目安は ${finishEstimate()} ごろ（追加分まで飲むと ${extraEstimate()} ごろ）`, key:true, big:true, go:'vNav', goLabel:'飲み始める' });
    day.push({ id:'e6', t:'', wide:true, title:`${homeArrive()}に来院してください`, dt: S.examTime ? `検査は${S.examTime}からです` : '', key:true });
  }else{   // β1.6.88：院内で飲む人も、飲み方の確認と飲み方ナビが使える
    day.push({ id:'e4c', t:'来院前', title:'モビプレップの飲み方と注意事項を確認する', gos:[{ go:'vRule', label:'飲み方を見る' }, { go:'vCaution', label:'服用時の注意点を見る' }] });
    day.push({ id:'e6', t:'', wide:true, title:`${CONFIG.clinic.arrive}に来院してください`, dt:'受付をすませて、看護師に声をかけてください' + (S.examTime ? `（検査は${S.examTime}からの予定です）` : ''), key:true });
    day.push({ id:'e5', t:startTime(), title:'院内でモビプレップを飲み始めます', dt:`看護師の案内に沿って飲みます。飲み終わりの目安は ${finishEstimate()} ごろ（追加分まで飲むと ${extraEstimate()} ごろ）`, key:true, big:true, go:'vNav', goLabel:'飲み始める' });
  }
  day.push({ id:'e7', t:'持ち物', title:'忘れ物はありませんか', steps:['保険証','お薬手帳','検査説明用紙・同意書・予約票','500mLの水かお茶','汚れたとき用の下着やズボン'] });
  day.push({ id:'e8', t:'服装', title:'アクセサリーなど貴金属は外してくる', dt:'ジェルネイルは落とさなくて大丈夫です' });
  if(CONFIG.sedation) day.push({ id:'e9', t:'運転', title:'鎮静剤・鎮痛剤を使う方は、車・バイク・自転車で来ない', ng:true, dt:'検査後30分〜1時間ほど休んでから帰れますが、当日は運転は出来ません。' });
  days.push({ key:'day', tab:'検査当日', label:fmtD(D), tag:'検査当日', date:D, items:day });
  days.push({ key:'after', tab:'検査後', label:'', tag:'検査のあと', items:[
    { id:'a1', t:'帰宅後', title:'検査後の過ごし方', go:'vAfter' },
    { id:'a3', t:'困ったら', title:'お腹の痛みが続く・赤い便が出るときは連絡', tel:true },   // β1.6.24：電話番号をここに出す（よくある質問はなし）
    S.surveyDone ? { id:'a9', t:'アンケート', title:'アンケートへのご協力、ありがとうございました' }
                 : { id:'a9', t:'アンケート', title:'このアプリのアンケートにご協力ください', dt:'4つの質問に答えるだけです（1分ほど）', go:'vSurvey', goLabel:'答える' }   // β1.6.29
  ]});
  return days;
}

let selDay = null;   // 表示中の日（pre3・pre2 など / prev / day / after）
const fmtS = dt => `${dt.getMonth()+1}/${dt.getDate()}（${WD[dt.getDay()]}）`;
function dayIsToday(d, today){
  return d.date ? sameD(d.date, today) : (d.range ? (today >= d.range[0] && today < addD(d.range[1],1)) : false);
}
function defaultDay(days){
  const today = new Date(), D = parseD(S.date);
  const t = days.find(d => dayIsToday(d, today)); if(t) return t.key;
  return today > D ? 'after' : days[0].key;
}
function renderSchedule(){
  const v = document.getElementById('vSchedule'), today = new Date();
  const place = S.place === 'home' ? '自宅で飲む' : '院内で飲む';
  const days = buildDays();
  if(!days.some(d => d.key === selDay)) selDay = defaultDay(days);
  const idx = days.findIndex(d => d.key === selDay), d = days[idx];

  let h = `<div class="panel summary"><div><span class="dl">検査日</span><div class="d">${fmtD(parseD(S.date))}</div><div class="p">下剤は${place}・${methodLabel()}</div></div><button type="button" id="btnChange">変更</button></div>`;
  h += a2hsCard();   // β1.6.57：ホーム画面に追加の案内（追加した・あとでを押したら出さない）
  // β1.6.0：前日までに確認すること（注意事項と下剤の飲み方の流れ）への入口。検査後のタブでは出さない
  if(selDay !== 'after'){
    const ok = !!S.checks.preOK;

  d.items.forEach(it => {

    const soft = !/^\d{1,2}:\d{2}$/.test(it.t);
    if(it.big){   // β1.6.14〜：「実際にモビプレップを飲み始める」は、特別な色のボタンだけを出す（β1.6.16：予定の枠の外に出して、上下に間をあける）

      + (it.wide ? '' : `<div class="t${soft?' soft':''}${soft && String(it.t).length >= 5 ? ' long' : ''}">${esc(it.t)}</div>`) + `<div>`
      + `<div class="ttl">${esc(it.title)}</div>`
      + (it.dt ? `<div class="dt">${esc(it.dt)}</div>` : '')
      + (it.steps && it.steps.length ? `<ol>${it.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>` : '')
      + (it.go ? `<button type="button" class="go" data-go="${it.go}">${esc(it.goLabel || '詳しく見る')}</button>` : '')

      + (it.gos ? `<div class="gos">${it.gos.map(g=>`<button type="button" class="go" data-go="${g.go}">${esc(g.label)}</button>`).join('')}</div>` : '')
      + `</div></div>`;   // β1.6.22：来院の文はチェックなし（β1.6.85：項目をタップして「済」の印をつける）
  });
  h += `</div></div>`;

  // 前の日・次の日（β1.6.30：「← 3日前」ではなく「前の日・次の日」）
  const pv = days[idx-1], nx = days[idx+1];
  h += `<div class="daynav">`
    + (pv ? `<button type="button" class="btn sub" data-day="${pv.key}">← 前の日</button>` : `<span></span>`)
    + (nx ? `<button type="button" class="btn" data-day="${nx.key}">次の日 →</button>` : `<span></span>`)
    + `</div>`;
  if(a2hsShowable()) h += `<div style="text-align:center;margin-top:18px"><button type="button" class="linkbtn" id="btnA2hsLink">ホーム画面に追加する</button></div>`;   // β1.6.57

// β1.6.98：同意の記録（番号・日時・同意した文の版）をGASに残す。文の版は、文の中身から決まる番号（文を直すと、自動で新しい番号になる）
const plainText = html => html.replace(/<li>/g, '・').replace(/<\/(p|li|h2)>/g, '\n').replace(/<[^>]+>/g, '').replace(/&quot;/g, '"').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').replace(/\n{2,}/g, '\n').trim();
const consentTextPlain = () => plainText(consentBodyHTML()) + '\n\n【記録の送り方】\n' + plainText(sendHowHTML('K7MQ2X')) + '\n\n【記録の取り扱い】\n' + plainText(handlingHTML()) + '\n\n【確認の欄】' + CONSENT_CHECK;
const fnv = t => { let h = 0x811c9dc5; for(let k = 0; k < t.length; k++){ h ^= t.charCodeAt(k); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); };

    .then(r => r.json()).then(j => { if(j && j.ok && S.consentLog && S.consentLog.at === at){ S.consentLog = { at:at, ver:c.ver, via:c.via, pending:false }; save(); } }).catch(() => {});   // 送れなかったときは、あとで自動で送り直す

  save();   // 同意したときは、ここで記録が送られる
  if(ok) sendConsentLog();
  // 同意をやめたとき：これまでに送った記録を、当院の記録から消してもらう（同意をやめた日時は、同意ログに残る）
  if(!ok && was === true && SETTINGS_URL && S.code && (!DEMO || EVAL)){
    const wd = () => { try{ fetch(SETTINGS_URL, { method:'POST', keepalive:true, body: JSON.stringify({ action:'withdraw', code:S.code, textVer:S.consentVer || '', appVer:APP_VERSION, clientAt:Date.now() }) }).catch(()=>{}); }catch(e){} };
    (S.consentLog && S.consentLog.pending ? sendConsentLog() : Promise.resolve()).then(wd, wd);
  }
  if(consentNext){ const f = consentNext; consentNext = null; return f(); }
  goBack();
}

function videoLink(key){
  const set = CONFIG.videos[curMethod()] || CONFIG.videos['2-1'], v = set[key];
  if(!v) return '';
  return `<a class="vlink" href="${esc(v.url)}" target="_blank" rel="noopener">`
    + `<span class="vthumb" style="background-image:url(${POSTERS[key]})"><span class="play" aria-hidden="true">▶</span></span>`
    + `<span class="vcap"><b>動画を見る（${esc(v.len)}）</b>${esc(v.title)}${v.note ? `<span class="vnote">${esc(v.note)}</span>` : ''}<small>EAファーマのサイトが開きます。最初に「はい」を押すと動画が見られます。</small></span></a>`;
}
function durText(min){ const h = Math.floor(min/60), m = min % 60; return h ? `${h}時間${m ? m + '分' : ''}` : `${m}分`; }
const telNo = () => esc(CONFIG.phone.replace(/[^\d]/g,''));
function prepHTML(){
  return `<div class="panel"><p>${esc(CONFIG.prepWhen)}</p>`
      + `${videoLink('prep')}`
      + `<div class="subh">手順</div>`
      + `<ol class="steps">${CONFIG.prepSteps.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>`
      + `<div class="banner ng" style="margin:4px 0 0">${esc(CONFIG.prepWarn)}</div></div>`;
}
function ruleHTML(){
  const tel = telNo();
  return `<div class="panel">${videoLink('drink')}`
    + `<div class="subh">きまり</div>`
    + (MP() ? `<div class="rule"><b>飲み方は「${MP().label}」です</b>モビプレップを${MP().mobiPerWater}杯飲むたびに、水かお茶を1杯飲みます。これを、便がきれいになるまで続けます。</div>` : '')
    + `<div class="rule"><b>コップ1杯（約${MP() ? MP().cup : CONFIG.mobiCupMl}mL）ずつ、ゆっくり</b>はじめの${CONFIG.slowCups}杯くらいは1杯を${CONFIG.slowMin}分くらいかけて、それ以降は1杯を${CONFIG.intervalMin}〜${CONFIG.slowMin}分くらいかけて飲みます。</div>`
    + (MP()
        ? `<div class="rule"><b>${MP().mobiPerWater}杯ごとに、水かお茶を1杯</b>モビプレップと同じコップで、水かお茶を1杯（約${MP().cup}mL）飲みます。</div>`
        : `<div class="rule"><b>${CONFIG.waterAfterEachMl/1000}L飲んだら、水かお茶を${CONFIG.waterMl}mL</b>モビプレップの合間に、決まった量の水かお茶を飲みます。</div>`)
    + `<div class="rule"><b>まず${BASE.text}は必ず飲みます</b>途中で便が④・⑤になっても、お腹の痛みや吐き気がなければ、ここまでは続けて飲みます。（目安：約${durText(minutesTo(CHECK_AT))}）</div>`
    + `<div class="rule"><b>ここで④・⑤になっていれば終わり</b>便が出ていない、またはお腹の痛み・吐き気・嘔吐があるときは、当院へ電話してください。便が出ていて④・⑤になっていないときは、追加で${EXTRA.text}を飲みます。</div>`
    + `<div class="rule"><b>追加の途中で④・⑤になったら</b>モビプレップはやめて、水かお茶をコップ1杯飲んで終わりです。追加分を飲んでも④・⑤にならないときは、当院へ電話してください。</div>`
    + `<div class="rule"><b>のどが渇いたら</b>${esc(CONFIG.thirstRule)}</div>`
    + `<div class="subh">飲んでもよいもの・いけないもの</div>`
    + `<div class="drinks"><div class="okbox"><div class="hd">○ 飲んでもよい</div><ul>${CONFIG.okDrinks.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`
    + `<div class="ngbox"><div class="hd">× 飲んではいけない</div><ul>${CONFIG.ngDrinks.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div></div>`
    + `<div class="subh">飲みにくいとき</div><ul class="list">${CONFIG.drinkTips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`
    + `<div class="subh" style="color:var(--ng)">次の症状が出たら、すぐに飲むのをやめて電話してください</div>`
    + `<p class="muted" style="margin:0 0 4px">1杯飲むたびに、症状がないか確かめてください。</p>`
    + `<ul class="stoplist cols">${CONFIG.stopSigns.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`
    + `<div class="subh">こんなときも電話してください</div>`
    + `<ul class="stoplist">${[`必ず飲む分（${BASE.text}）を飲んでも、便が出ない`, '必ず飲む分を飲んだところで、お腹の痛み・吐き気・嘔吐がある', `追加分（${EXTRA.text}）まで飲んでも、便が④・⑤にならない`, '飲み終わったあとに上の症状が出たとき'].map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`
    + `<a class="tel" href="tel:${tel}">${IC_TEL}${esc(CONFIG.phone)}</a></div>`;
}
function cautionHTML(){
  const tel = telNo();
  return `<div class="panel">${videoLink('caution')}`
    + `<div class="caution"><div class="ch">いつも</div><b>一人で飲まない</b>モビプレップは、ご家族など誰かがそばにいるときに飲んでください。</div>`
    + `<div class="caution"><div class="ch">飲む前</div><b>便秘・下痢が続いているとき</b>${esc(CONFIG.beforeRule)}<div class="to">→ 前もって電話</div></div>`
    + `<div class="caution"><div class="ch">飲み始めてから ①</div><b>症状が出たとき</b>気分がわるい・お腹が痛い・吐いた・寒気・じんましんなどの症状が出たら、がまんせずにすぐ飲むのをやめてください。飲み終わったあとに症状が出たときも同じです。<div class="to">→ すぐにやめて電話</div></div>`
    + `<div class="caution"><div class="ch">飲み始めてから ②</div><b>モビプレップを飲んでも便が出ないとき</b>${esc(CONFIG.halfRule)}<div class="to">→ 飲むのをいったんやめて電話</div></div>`
    + `<a class="tel" href="tel:${tel}">${IC_TEL}${esc(CONFIG.phone)}</a></div>`;
}
const telBtn = () => `<a class="tel" href="tel:${esc(CONFIG.phone.replace(/[^\d]/g,''))}">${IC_TEL}${esc(CONFIG.phone)}</a>`;
const undoClearBtn = () => `<div style="text-align:center"><button type="button" class="linkbtn" id="btnUnclear">実はまだ便がきれいになっていない。④・⑤を押し間違えた（記録を取り消す）</button></div>`;
// 追加分の途中で④⑤になったとき：水・お茶を1杯飲んで終わり
function lastWaterHTML(){
  const cup = (MP() ? MP().cup : CONFIG.waterCupMl);
  return `<div class="stage ok"><div class="mark">✓</div><b>モビプレップは、もう飲まなくて大丈夫です</b></div>`
    + `<div class="next"><div class="what">${S.lastWaterInProg ? 'いま飲んでいる水・お茶を飲み終えたら終わりです' : '最後にこれだけ飲んで終わりです'}</div>`
    + (S.lastWaterInProg ? '' : cupSVG('w', cup) + `<div class="big">水かお茶 コップ1杯</div>`)
    + `<button type="button" class="btn" id="btnFinish">${S.lastWaterInProg ? '飲み終わった（これで終わり）' : '飲みました（これで終わり）'}</button></div>`
    + undoClearBtn();
}
// β1.6.74：お腹が痛い・吐き気があると押したあとに終わったときの一文
const painNote = () => `<p class="say">お腹の痛みや吐き気がある場合は、${inClinic() ? '看護師に声をかけて' : '当院へ連絡して'}ください。</p>`;
// すべて終了
function doneHTML(){
  const arrive = S.place === 'home' ? `<p class="arr"><b>${homeArrive()}</b> に来院してください。</p>` : `<p class="arr">看護師に声をかけてください。</p>`;   // β1.6.11：大きく表示
  return `<div class="stage ok"><div class="mark">✓</div><b>下剤はこれで終わりです。おつかれさまでした。</b></div>`
    + `<div class="donebox">${arrive}</div>`
    + (S.baseCall === 'pain' && !S.callAck ? painNote() + contactTel() : '')   // β1.6.74
    + undoClearBtn();
}
// 全部飲んでもきれいにならない
function notClearAllHTML(){
  return `<div class="stage ng"><div class="mark">!</div><b>全部飲み終わりましたが、便がまだきれいになっていません</b></div>`
    + `<p>このあとどうするか、${inClinic() ? '看護師に声をかけて' : '当院へ電話して'}確認してください。</p>` + contactTel();
}
// 便の記録を受けて、このあとどうするかを決める
// β1.6.89：必ず飲む分の終わりの確認（排便の回数が足りているか）
const minStools = () => Number(CONFIG.minStools) || 5;
let bq = { countOK:null };   // 確認の途中経過（true：5回以上と答えた／false：足りないと答えた／null：記録の回数で見る）。閉じたら最初から
const countOK = () => bq.countOK === true ? true : bq.countOK === false ? false : S.stools.length >= minStools();
function openBaseCheck(step){
  const sh = document.getElementById('sheet'), n = S.stools.length, min = minStools();
  if(!step) step = n < min ? 'forgot' : 'toilet';
  const stage = t => `<div class="stage go"><div class="mark">?</div><b>${t}</b></div>`;
  const later = `<button type="button" class="linkbtn" id="spLater" style="display:block;margin:6px auto 0">あとで</button>`;
  const painBtn = `<button type="button" class="btn sub" id="btnPain">お腹が痛い・吐き気がある・吐いた</button>`;
  let h = '';
  if(step === 'forgot'){
    h = stage('必ず飲む分を飲み終わりました')
      + `<p class="say">${n ? `トイレの記録は<b>${n}回</b>です。` : 'トイレの記録が<b>まだありません</b>。'}ここまでに、ふつう<b>${min}回以上</b>は便が出ます。<b>記録を忘れていませんか？</b></p>`
      + `<button type="button" class="btn" id="btnForgotYes">忘れていた</button>`
      + (n ? `<button type="button" class="btn sub" id="btnForgotNo">忘れていない（記録のとおり）</button>` : `<button type="button" class="btn sub" id="btnNoStool">忘れていない（まだ便が出ていない）</button>`)
      + painBtn + later;
  }else if(step === 'count'){
    h = stage('これまでの排便は、全部で何回ありましたか？') + `<p class="say">記録していない分も数えてください。</p>`
      + `<button type="button" class="btn" id="btnCnt5">${min}回以上</button>`
      + `<button type="button" class="btn sub" id="btnCntLt">1〜${min-1}回</button>`
      + `<button type="button" class="btn sub" id="btnNoStool">まだ出ていない</button>` + later;
  }else if(step === 'color'){
    h = stage('最後の便の色は、どれでしたか？') + `<p class="say">いちばん近いものを押してください。</p><div class="stool big">${stoolBtns(null)}</div>` + later;
  }else{   // toilet：最後の記録のあとに、トイレに行ったか
    h = askToiletHead() + `<div class="stool big">${stoolBtns(null)}</div>`
      + `<button type="button" class="btn sub" id="btnNotGone" style="margin-top:12px">トイレに行っていない</button>` + painBtn + later;
  }
  sh.innerHTML = h;
  document.getElementById('ov').classList.remove('hidden');
  document.getElementById('spLater').onclick = closeSheet;
}
function judgeStool(lv){
  const i = S.drinks.length, inProg = i > 0 && !S.curDone, cur = STEPS[i-1];
  if(S.baseCall === 'nostool' && !S.callAck){ S.baseCall = ''; }      // 便が出たので、改めて判断
  if(!pastBase()) return isClear(lv) ? 'baseContinue' : 'continue';   // 必ず飲む分の途中：きれいになっても続ける
  if(!baseJudged()){                                                 // 必ず飲む分を飲み終えたところ：最後の記録の色と、排便の回数で判断（途中の④・⑤は関係しない）
    if(isClear(lv) && countOK()){ S.allDone = true; return 'doneBase'; }
    S.baseOK = true; return isClear(lv) ? 'toExtraCount' : 'toExtra';
  }
  if(S.baseCall === 'pain' && !S.callAck && isClear(lv)){ S.allDone = true; return 'painDone'; }   // β1.6.74：お腹が痛いのあとに④・⑤→終わり
  if(S.baseCall && !S.callAck) return 'callBase';                    // 電話の案内中は、それを優先
  if(isClear(lv)){                                                   // 追加分・その後：きれいになったら終わり
    S.stopMobi = true;
    if(!inProg && cur && cur.kind === 'w'){ S.allDone = true; return 'doneExtra'; }
    S.lastWaterInProg = !!(inProg && cur && cur.kind === 'w');
    return 'stopExtra';
  }
  if(S.baseCall && !S.callAck) return 'callBase';
  if(pastExtra() && S.extraCall && !S.extraAck) return 'callExtra';
  if(i >= STEPS.length && S.curDone) return 'notClearAll';
  return 'continue';
}
function openStoolResult(lv, res){
  const s = STOOL[lv-1];
  const sw = `<div class="pick"><span style="background:${s.c}"></span>${s.n} ${s.label}</div>`;
  const ok = (title) => `<div class="stage ok"><div class="mark">✓</div><b>${title}</b></div>${sw}`;
  const go = (title) => `<div class="stage go"><div class="mark">→</div><b>${title}</b></div>${sw}`;
  const ng = (title) => `<div class="stage ng"><div class="mark">!</div><b>${title}</b></div>${sw}`;
  let h = '';
  switch(res){
    case 'baseContinue':
      h = ok('便がきれいになってきました') + `<p class="say">いい感じです。お腹の痛みや吐き気がなければ、<b>必ず飲む分（${BASE.text}）まで続けて飲みましょう。</b></p>`; break;
    case 'doneBase':
      h = ok('便がきれいになりました') + `<p class="say">必ず飲む分を飲み終わっているので、<b>モビプレップはここで終わりです。</b></p>`; break;
    case 'toExtraCount':   // β1.6.89：便の色はきれいでも、排便の回数が足りないとき
      h = go('排便の回数が、まだ足りません') + `<p class="say">便の色はきれいですが、排便が${minStools()}回に届いていません。<b>追加で ${EXTRA.text} を飲みましょう。</b>④（うすい黄）か⑤（透明）になったら、その時点で終わりです。</p>`
        + `<p class="muted">お腹の痛み・吐き気・嘔吐があるときは、飲むのをやめて下のボタンを押してください。</p>`
        + `<button type="button" class="btn sub" id="btnPain">お腹が痛い・吐き気がある・吐いた</button>`; break;
    case 'toExtra':
      h = go('まだきれいになっていません') + `<p class="say"><b>追加で ${EXTRA.text} を飲みましょう。</b>④（うすい黄）か⑤（透明）になったら、その時点で終わりです。</p>`
        + `<p class="muted">お腹の痛み・吐き気・嘔吐があるときは、飲むのをやめて下のボタンを押してください。</p>`
        + `<button type="button" class="btn sub" id="btnPain">お腹が痛い・吐き気がある・吐いた</button>`; break;
    case 'stopExtra':
      h = ok('便がきれいになりました') + `<p class="say">モビプレップは、<b>もう飲まなくて大丈夫です。</b></p>`
        + `<p class="say">${S.lastWaterInProg ? 'いま飲んでいる水・お茶を飲み終えたら、終わりです。' : '最後に<b>水かお茶をコップ1杯</b>飲んで、終わりです。'}</p>`; break;
    case 'doneExtra':
      h = ok('便がきれいになりました') + `<p class="say">水・お茶まで飲み終わっているので、<b>これで下剤は終わりです。</b></p>`; break;
    case 'painDone':   // β1.6.74
      h = ok('便はきれいになりました') + `<p class="say">必ず飲む分を飲み終わっているので、<b>モビプレップはここで終わりです。</b></p>` + painNote(); break;
    case 'callBase': case 'callExtra': case 'notClearAll':
      if(isClear(lv)){   // β1.6.71：④・⑤なのに「まだきれいになっていません」と出ていた（お腹の痛み・吐き気で電話の案内中のとき）
        h = ok('便はきれいになりました')   // β1.6.72：電話の文は出さない（院長の指示）
          + (pastBase() ? `<p class="say">必ず飲む分を飲み終わっているので、<b>モビプレップはここで終わりです。</b></p>` : ''); break;   // β1.6.73
      }
      h = ng('まだきれいになっていません') + (inClinic() ? `<p class="say"><b>看護師に声をかけて</b>、このあとどうするか確認してください。</p>` : `<p class="say"><b>当院へ電話して</b>、このあとどうするか確認してください。</p><p class="muted">電話番号は、このあとの画面に表示します。</p>`); break;
    default:
      h = go('まだきれいになっていません') + `<p class="say"><b>モビプレップを続けて飲みましょう。</b>${pastBase() ? '④（うすい黄）か⑤（透明）になったら終わりです。' : `まずは必ず飲む分（${BASE.text}）まで飲みます。`}</p>`;
  }
  const sh = document.getElementById('sheet');
  sh.innerHTML = h + `<button type="button" class="btn" id="srOk" style="margin-top:14px">わかりました</button>`;
  document.getElementById('ov').classList.remove('hidden');
  document.getElementById('srOk').onclick = () => { closeSheet(); if(current === 'vNav') alignNav(); else window.scrollTo(0,0); };   // β1.6.60：トイレの記録のあとも「必ず飲む」の高さに戻す
}
function startTick(){ clearInterval(tick); updatePace(); tick = setInterval(updatePace, 1000); }
function updatePace(){
  const el = document.getElementById('pace'), ct = document.getElementById('count'); if(!el) return;
  const i = S.drinks.length; if(!i || S.curDone || !STEPS[i-1] || STEPS[i-1].kind !== 'm') return;
  const dur = intervalFor(i) * 60, sec = Math.max(0, Math.floor((Date.now() - S.drinks[i-1]) / 1000));
  // この1杯を飲み始めてからの時間
  if(ct){ ct.innerHTML = `<small>この1杯を飲み始めて</small>${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`; ct.className = 'count'; }
  if(sec >= dur){ el.textContent = '飲み終わったら、下のボタンを押してください'; el.className = 'pace ok'; }
  else { el.textContent = ''; el.className = 'pace'; }   // β1.6.49：「コップの絵に合わせて…」の文はなし
}
async function keepAwake(){
  try{ if('wakeLock' in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>wakeLock=null); } }catch(e){}
}

const backBtn = () => `<button type="button" class="btn sub bottomback" data-back="1">← もどる</button>`;

/* ---------- 画面切り替え（スマホの「戻る」でも戻れる） ---------- */
const VIEWS = ['vSetup','vSchedule','vFood','vNav','vAfter','vPrep','vRule','vCaution','vCancel','vBefore','vConsent','vSurvey','vEnded','vEval'];
const HASH  = { vSetup:'setup', vSchedule:'schedule', vFood:'food', vNav:'drink', vAfter:'after', vPrep:'prep', vRule:'rule', vCaution:'caution', vCancel:'cancel', vBefore:'before', vConsent:'consent', vSurvey:'survey', vEnded:'end', vEval:'eval' };
const TITLE = { vSetup:'はじめに', vSchedule:'検査までの予定', vFood:'食事のこと', vNav:'飲み方ナビ', vAfter:'検査のあと', vPrep:'モビプレップの作り方', vRule:'飲み方のきまり', vCaution:'服用時の注意点', vCancel:'検査の予約について', vBefore:'前日までに確認してください', vConsent:'記録の取り扱いについて', vSurvey:'アプリのアンケート', vEnded:'検査が終わりました', vEval:'スタッフ評価シート' };
let current = '';
const stack = [];          // 戻り先の記録（アプリ内で管理）
const scrollMem = {};
let skipPop = 0;           // 「もどる」ボタンで履歴を戻したときの通知を無視する回数

// 開く環境によっては履歴の操作が禁止されているため、失敗しても止まらないようにする
function hist(kind, id){ try{ history[kind]({ v:id }, '', '#' + HASH[id]); return true; }catch(e){ return false; } }

// β1.6.35：検査日より前に飲み方ナビを開いたときは「練習」として使う（本番の記録とは別。保存も送信もしない）
let PRACTICE = false, realS = null, practiceS = null;
const practiceDay = () => !DEMO && /^\d{4}-\d{2}-\d{2}$/.test(S.date || '') && ymdOf(new Date()) < S.date;
const newPractice = base => Object.assign(blankState(), { date:base.date, examTime:base.examTime, place:base.place, method:base.method, consent:false });
function practiceSwitch(id){
  if(id === 'vNav' && !PRACTICE && practiceDay()){ realS = S; S = practiceS || newPractice(realS); PRACTICE = true; }
  else if(id !== 'vNav' && PRACTICE){ practiceS = S; S = realS; realS = null; PRACTICE = false; }
}
function render(id, restore){
  practiceSwitch(id);
  if(S.cancelled && !DEMO) id = 'vCancel';   // 院内で予約が取り消されたときは、ほかの画面を出さない
  if(isEnded() && !['vEnded','vAfter'].includes(id) && !(id === 'vSurvey' && surveyOpen())) id = 'vEnded';   // β1.6.33：検査日の翌日から
  if(current) scrollMem[current] = window.scrollY;
  current = id;
  VIEWS.forEach(v => document.getElementById(v).classList.toggle('hidden', v !== id));
  document.getElementById('hTitle').textContent = TITLE[id];
  const canBack = id !== 'vSchedule' && id !== 'vCancel' && id !== 'vEnded' && !(id === 'vSetup' && !S.date) && !(id === 'vConsent' && needConsent());
  document.getElementById('btnBack').classList.toggle('hidden', !canBack);
  if(id === 'vSchedule') renderSchedule();
  if(id === 'vFood') renderFood();
  if(id === 'vNav'){ navOpening = true; renderNav(); navOpening = false; } else clearInterval(tick);
  if(id === 'vAfter') renderAfter();
  if(id === 'vPrep')    document.getElementById(id).innerHTML = prepHTML();
  if(id === 'vRule')    document.getElementById(id).innerHTML = ruleHTML();
  if(id === 'vCaution') document.getElementById(id).innerHTML = cautionHTML();
  if(id === 'vConsent') document.getElementById(id).innerHTML = consentHTML();
  if(id === 'vSurvey') document.getElementById(id).innerHTML = surveyHTML();
  if(id === 'vEnded') document.getElementById(id).innerHTML = endedHTML();
  if(id === 'vEval') document.getElementById(id).innerHTML = evalHTML();
  if(id === 'vBefore' && !restore) beforeTab = 'caution';   // 予定の画面から開いたときは①から
  if(id === 'vBefore')  document.getElementById(id).innerHTML = beforeHTML();
  if(id === 'vSetup') renderSetup();
  if(id === 'vCancel') renderCancel();
  if(['vFood','vAfter','vPrep','vRule','vCaution','vBefore'].includes(id)) document.getElementById(id).insertAdjacentHTML('beforeend', backBtn());
  window.scrollTo(0, restore ? (scrollMem[id] || 0) : 0);
}
function show(id){
  if(id === current) return;
  stack.push({ id:current, h:hist('pushState', id) });
  render(id);
}
function goBack(){
  const prev = stack.pop();
  if(prev && prev.h){ skipPop++; try{ history.back(); }catch(e){ skipPop--; } }
  render(prev && prev.id ? prev.id : 'vSchedule', true);
}
function resetTo(id){ stack.length = 0; hist('replaceState', id); render(id); }
function fromHash(){
  let h = ''; try{ h = location.hash.replace('#',''); }catch(e){}
  const id = Object.keys(HASH).find(k => HASH[k] === h);
  return (id && (S.date || id === 'vSetup')) ? id : (S.date ? 'vSchedule' : 'vSetup');
}
// スマホ本体の「戻る」
window.addEventListener('popstate', () => {
  if(skipPop > 0){ skipPop--; return; }
  const prev = stack.pop();
  render(prev && prev.id ? prev.id : fromHash(), true);
});

/* ---------- 検査日のカレンダー ---------- */
let calY = 0, calM = 0;   // 表示中の年・月（月は0〜11）
const ymd = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
function renderCal(){
  const el = document.getElementById('cal'); if(!el) return;
  const sel = document.getElementById('inDate').value, now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const first = new Date(calY, calM, 1), days = new Date(calY, calM+1, 0).getDate();
  const canPrev = calY > today.getFullYear() || (calY === today.getFullYear() && calM > today.getMonth());
  let g = WD.map((w,k) => `<div class="wd${k===0?' su':k===6?' sa':''}">${w}</div>`).join('');
  for(let k=0; k<first.getDay(); k++) g += '<span></span>';
  for(let d=1; d<=days; d++){
    const dt = new Date(calY, calM, d), v = ymd(dt), wd = dt.getDay();
    const past = dt < today && v !== sel;   // 過去の日は選べない（すでに選んである日は表示する）
    g += `<button type="button" class="cd${wd===0?' su':wd===6?' sa':''}${sameD(dt,today)?' td':''}${v===sel?' sel':''}" data-cald="${v}"${past?' disabled':''} aria-label="${calM+1}月${d}日">${d}</button>`;
  }
  el.innerHTML = `<div class="ch"><button type="button" data-calm="-1"${canPrev?'':' disabled'} aria-label="前の月">‹</button><b>${calY}年${calM+1}月</b><button type="button" data-calm="1" aria-label="次の月">›</button></div>`
    + `<div class="cg">${g}</div>`
    + (sel ? `<div class="calsel">${fmtD(parseD(sel))}</div>` : `<div class="calsel none">検査日を押してください</div>`);
}
function calMove(n){ const d = new Date(calY, calM + n, 1); calY = d.getFullYear(); calM = d.getMonth(); renderCal(); }

function renderSetup(){
  document.getElementById('inDate').value = S.date || '';
  { const b = S.date ? parseD(S.date) : new Date(); calY = b.getFullYear(); calM = b.getMonth(); }
  renderCal();
  document.querySelectorAll('#vSetup .choice').forEach(b => b.setAttribute('aria-pressed', b.dataset.place === S.place));
  document.getElementById('homeNote').textContent = `${homeStart()}から飲み始め`;
  document.getElementById('clinicNote').textContent = `${CONFIG.clinic.arrive}に来院・${startTime()}ごろ飲み始め`;
  document.getElementById('setupErr').textContent = '';
}
