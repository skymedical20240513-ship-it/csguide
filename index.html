  sh.innerHTML = `<div class="stage ng"><div class="mark">!</div><b>ペースが速すぎます</b></div>`
    + `<p class="say">モビプレップは、1杯を${CONFIG.intervalMin}〜${CONFIG.slowMin}分くらいかけて<b>ゆっくり</b>飲んでください。</p>`
    + `<p class="muted">速く飲むと、気分が悪くなったり吐き気が出たりすることがあります。押し間違えた場合は「押し間違えたので1つ戻す」で戻せます。</p>`
    + `<button type="button" class="btn" id="tfOk" style="margin-top:12px">わかりました</button>`;
  document.getElementById('ov').classList.remove('hidden');
  document.getElementById('tfOk').onclick = closeSheet;
}
function closeSheet(){ document.getElementById('ov').classList.add('hidden'); }

/* ---------- 操作 ---------- */
document.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.classList && e.target.classList.contains('bigbtn')) e.target.click(); });
// β1.6.98：「読みました」にチェックを入れると、「同意する」が押せるようになる
document.addEventListener('change', e => { if(e.target && e.target.id === 'readChk'){ const b = document.getElementById('btnConsentYes'); if(b) b.disabled = !e.target.checked; } });
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-go]');
  if(!t){   // β1.6.85：項目のどこかをタップすると「済」の印をつける／はずす（電話番号のリンクは除く）
    const it = e.target.closest('.item[data-chk]');
    if(it && !e.target.closest('a')){ const id = it.dataset.chk; S.checks[id] = !S.checks[id]; save(); renderSchedule(); }
    return;
  }
  if(t.dataset.back) return goBack();
  if(t.dataset.evr){ const v = Number(t.dataset.evv); if(EV.r[t.dataset.evr] === v) delete EV.r[t.dataset.evr]; else EV.r[t.dataset.evr] = v; evSave(); evMsg = ''; return render('vEval', true); }   // β1.6.66
  if(t.dataset.evrole){ EV.role = t.dataset.evrole; evSave(); evMsg = ''; return render('vEval', true); }
  if(t.dataset.themeSet){ themeSet(t.dataset.themeSet === 'auto' ? '' : t.dataset.themeSet); if(current === 'vSchedule') renderSchedule(); return; }   // β1.6.64
  if(t.dataset.cald){ document.getElementById('inDate').value = t.dataset.cald; document.getElementById('setupErr').textContent = ''; return renderCal(); }
  if(t.dataset.calm) return calMove(Number(t.dataset.calm));
  if(t.dataset.sv){ const q = SURVEY.find(x => x.id === t.dataset.sv); if(q){ surveyAns[q.id] = q.o[Number(t.dataset.svk)]; surveyMsg = ''; render('vSurvey', true); } return; }   // β1.6.29
  if(t.dataset.jump){ const el = document.getElementById(t.dataset.jump); if(el) el.scrollIntoView({ behavior:'smooth', block:'start' }); return; }   // β1.6.7
  if(t.dataset.btab){ beforeTab = t.dataset.btab; document.getElementById('vBefore').innerHTML = beforeHTML() + backBtn(); return window.scrollTo(0,0); }
  if(t.dataset.day){ selDay = t.dataset.day; renderSchedule(); return window.scrollTo(0,0); }
  if(t.dataset.go) return show(t.dataset.go);
  if(t.classList.contains('choice') && t.dataset.place){ S._pick = t.dataset.place; document.querySelectorAll('#vSetup .choice').forEach(b=>b.setAttribute('aria-pressed', b===t)); return; }
  if(t.dataset.stool){
    const lv = Number(t.dataset.stool);
    S.stools.push({ lv, t:Date.now() }); computeCheck();
    const res = judgeStool(lv);
    save(); renderNav(); return openStoolResult(lv, res);
  }
  switch(t.id){
    case 'btnPracticeReset': { if(PRACTICE){ closeSheet(); S = newPractice(realS); renderNav(); window.scrollTo(0,0); } return; }
    case 'btnSurveySend': return sendSurvey();
    case 'btnEvalSend': return sendEval();
    case 'btnEvalAgain': evDone = false; return render('vEval');
    case 'btnA2hs': case 'btnA2hsLink': return openA2hs();   // β1.6.57
    case 'btnA2hsLater': a2hsSet('later'); return renderSchedule();
    case 'btnSendHow': return openInfo('記録の送り方', sendHowHTML(S.code && !DEMO ? S.code : 'K7MQ2X'));   // β1.6.95
    case 'btnHandling': return openInfo('記録の取り扱い', handlingHTML());
    case 'btnConsentYes': { const ck = document.getElementById('readChk'); if(!ck || !ck.checked) return; return setConsent(true); }   // β1.6.98：チェックが入っているときだけ
    case 'btnConsentNo': return setConsent(false);
    case 'btnPreOK': { S.checks.preOK = true; save(); return goBack(); }
    case 'btnStart': {
      const d = document.getElementById('inDate').value;
      const p = S._pick || S.place;
      if(!d || !p){ document.getElementById('setupErr').textContent = !d ? '検査日を選んでください。' : '飲む場所を選んでください。'; return; }
      if(d !== S.date){ S.checks = {}; S.drinks = []; S.stools = []; S.delStools = []; S.stopMobi = false; S.allDone = false; S.checkDone = false; S.noStool = false; S.callAck = false; S.curDone = false; S.baseOK = false; S.baseCall = ''; S.extraCall = false; S.extraAck = false; S.lastWaterInProg = false; }
      S.date = d; S.place = p; delete S._pick; save(); selDay = null;
      return resetTo('vSchedule');
    }
    case 'btnChange': return show('vSetup');
    case 'btnDrink': {   // 次の1杯を飲み始める
      S.drinks.push(Date.now()); S.curDone = false; save(); return renderNav();
    }
    case 'btnDone': {    // いま飲んでいる1杯を飲み終わった
      const i = S.drinks.length, cs = STEPS[i-1];
      const tooFast = cs && cs.kind === 'm' && (Date.now() - S.drinks[i-1]) < CONFIG.tooFastMin*60000;
      const endHere = (i === CHECK_AT) || (i === EXTRA_AT) || (i === STEPS.length);
      if(S.stopMobi && S.lastWaterInProg){ S.allDone = true; save(); renderNav(); return window.scrollTo(0,0); }
      if(endHere) S.curDone = true;
      else { S.drinks.push(Date.now()); S.curDone = false; }   // そのまま次の1杯へ
      computeCheck();
      let after = '';
      if(i === CHECK_AT && !S.stopMobi){
        // β1.6.89：必ず飲む分を飲み終えたときの便で判断する。まず記録の確認（5回に足りなければ「忘れていませんか？」、足りていれば「最後の記録のあとにトイレに行きましたか？」）
        bq = { countOK:null }; after = 'base';
      }else if(i === EXTRA_AT && i !== CHECK_AT && !S.stopMobi){
        // 追加分を飲み終えた：きれいでなければ電話
        if(isClear(lastLv())) S.allDone = true; else { S.extraCall = true; after = 'callExtra'; }
      }
      save(); renderNav();
      if(after){ window.scrollTo(0,0);
        if(after === 'base') return openBaseCheck();
        if(after === 'callExtra') return openCallNotice('extra');
        return openStoolResult(lastLv(), after);
      }
      if(tooFast) return openTooFast();   // β1.6.69：お試し版・評価版でも出す（スタッフが評価で確かめられるように）
      return;
    }
    case 'btnUndo':
      if(S.curDone) S.curDone = false; else { S.drinks.pop(); S.curDone = false; }
      computeCheck();
      if(!pastBase()){ S.baseOK = false; S.baseCall = ''; S.callAck = false; bq = { countOK:null }; }
      if(!pastExtra()){ S.extraCall = false; S.extraAck = false; }
      save(); return renderNav();
    case 'btnStoolUndo': delStool(S.stools.pop()); unclearIfNeeded(); computeCheck(); if(!S.stools.length && !S.callAck) S.baseOK = false; save(); return renderNav();
    case 'btnNoStool': S.baseCall = 'nostool'; S.baseOK = false; save(); closeSheet(); renderNav(); return window.scrollTo(0,0);
    case 'btnPain': S.baseCall = 'pain'; S.baseOK = false; S.callAck = false; save(); closeSheet(); renderNav(); return window.scrollTo(0,0);
    case 'btnToilet': return openStoolPicker('toilet');
    case 'btnCallAck':
      if(pastExtra() && S.extraCall && !S.extraAck) S.extraAck = true; else { S.callAck = true; S.baseOK = true; }
      save(); renderNav(); return window.scrollTo(0,0);
    case 'btnCheck': return openStoolPicker('check');
    case 'btnBaseCheck': return openBaseCheck();   // β1.6.89
    case 'btnForgotYes': return openBaseCheck('count');
    case 'btnForgotNo': {   // β1.6.90：「忘れていない」なら、トイレに行ったかは聞き直さず、記録のとおり（最後の記録の色と回数）で判断する
      if(!(pastBase() && !baseJudged() && S.stools.length)) return closeSheet();
      bq.countOK = null; const lv = lastLv(), res = judgeStool(lv);
      save(); closeSheet(); renderNav(); window.scrollTo(0,0);
      return openStoolResult(lv, res); }
    case 'btnCnt5': bq.countOK = true; return openBaseCheck('color');
    case 'btnCntLt': bq.countOK = false; return openBaseCheck('color');
    case 'btnNotGone': {   // β1.6.89：最後の記録のあとにトイレに行っていない → 最後の記録の色と、排便の回数で判断
      if(!(pastBase() && !baseJudged() && S.stools.length)) return closeSheet();
      const lv = lastLv(), res = judgeStool(lv);
      save(); closeSheet(); renderNav(); window.scrollTo(0,0);
      return openStoolResult(lv, res); }
    case 'btnPcReset': {   // β1.6.74：パソコンで開いたときだけ。検査日などを消して「はじめに」から（β1.6.75：試作版のときだけ）
      if(!pcResetOK()) return;
      // β1.6.87：確認の窓（confirm）は、Claudeのプレビューなどでは出ずに何も起きないことがあるため、ボタンをもう一度押す方式に。ページの読み込み直しもせず、その場で最初に戻す
      if(!t.dataset.armed){ t.dataset.armed = '1'; t.textContent = '記録を消して最初からやり直す（もう一度押すと実行）'; setTimeout(() => { if(t.isConnected){ delete t.dataset.armed; t.textContent = '最初からやり直す（試作版のみ）'; } }, 6000); return; }
      const m = S.method; try{ localStorage.removeItem(KEY); }catch(e){}
      try{ history.replaceState(null, '', location.pathname); }catch(e){}   // アドレスの古い検査日（?d=…）も消す
      S = blankState(); S.method = m; save(); selDay = null; closeSheet(); window.scrollTo(0,0);
      return resetTo('vSetup'); }
    case 'btnUnclear': {   // ④・⑤の押し間違い：最後に続いている④・⑤の記録をまとめて消す
      while(S.stools.length && S.stools[S.stools.length-1].lv >= CONFIG.clearLevel) delStool(S.stools.pop());
      computeCheck(); S.stopMobi = false; S.allDone = false; S.lastWaterInProg = false;
      if(pastBase() && !baseJudged() && S.stools.length && !isClear(lastLv())) S.baseOK = true;   // 必ず飲む分の終わり：①〜③なら追加分へ
      if(pastExtra() && !S.extraAck && S.drinks.length === EXTRA_AT && S.curDone) S.extraCall = true;
      save(); return renderNav(); }
    case 'btnFinish': S.allDone = true; save(); renderNav(); return window.scrollTo(0,0);
    case 'btnSick': return openSick();
    case 'btnDemoReset': {   // お試し版：最初からやり直す（飲み方はQRコードの指定のまま）
      // β1.6.87：確認の窓（confirm）は出せない環境があるため、ボタンをもう一度押す方式に
      if(!t.dataset.armed){ t.dataset.armed = '1'; const orig = t.textContent; t.textContent = 'もう一度押すと消えます'; setTimeout(() => { if(t.isConnected){ delete t.dataset.armed; t.textContent = orig; } }, 6000); return; }
      const m = S.method; try{ localStorage.removeItem(KEY); }catch(e){}
      S = blankState(); S.method = m; save(); selDay = null; closeSheet(); window.scrollTo(0,0);
      if(needConsent()){ consentNext = () => resetTo('vSetup'); return resetTo('vConsent'); }   // β1.6.27：やり直すときも同意の画面から
      return resetTo('vSetup');
    }
  }
});
document.getElementById('ov').addEventListener('click', e => { if(e.target.id === 'ov') closeSheet(); });
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden'){ syncNow(); return; }
  backToToday();   // β1.6.34：ほかのアプリから戻ってきたら、今日の予定へ
  refreshSched();
  // ほかの画面から戻ってきたとき：時間を計算し直して表示する
  if(current === 'vNav'){ wakeLock = null; if(S.drinks.length) keepAwake(); renderNav(); }
});

// β1.6.34：今日のタブへ戻す（予定の画面を見ているときは描き直す）。検査日が過ぎていれば「検査が終わりました」へ
let shownDay = '';
function backToToday(){
  shownDay = ymdOf(new Date()); selDay = null;
  if(current === 'vSchedule' || isEnded()) render(current, true);
}
setInterval(() => { if(document.visibilityState === 'visible' && shownDay && ymdOf(new Date()) !== shownDay) backToToday(); }, 60000);   // 開いたまま日付が変わったとき

/* ---------- 起動 ---------- */
(async function init(){
  document.getElementById('ver').textContent = 'Ver ' + APP_VERSION;
  await loadRemoteConfig();
  const ld = document.getElementById('loading'); if(ld) ld.remove();
  document.getElementById('proto').classList.toggle('hidden', !CONFIG.prototype);
  const q = new URLSearchParams(location.search);
  if(DEMO){ document.getElementById('demo').classList.remove('hidden'); }
  if(EVAL){   // β1.6.66：評価版の帯（評価シートへの入口）
    const dm = document.getElementById('demo'); dm.classList.add('evalbar');
    dm.querySelector('span').innerHTML = '<b>スタッフ評価版</b>です。記録は送られません。';
    dm.insertAdjacentHTML('beforeend', '<button type="button" class="evgo" data-go="vEval">評価シート</button>');
    dm.querySelector('#btnDemoReset').textContent = 'やり直す';
  }
  load();
  const qc = DEMO ? '' : (q.get('c') || '').toUpperCase();   // お試し版では番号を使わない
  let sched = null, schedChanged = false;
  if(/^[A-Z0-9]{3,8}$/.test(qc)){
    const r = await fetchPatient(qc), remote = r && r.state;
    sched = r && r.sched;
    if(qc !== S.code){
      // 別の患者さん（または初めて）：番号の記録があれば取り出し、なければ新しく始める
      S = Object.assign(blankState(), remote || {}); S.code = qc;
    }else if(remote && (remote.updatedAt || 0) > (S.updatedAt || 0)){
      S = Object.assign(blankState(), remote); S.code = qc;
    }
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  }
  // QRコードから開いたのでないとき（ホーム画面やブックマークから）は、待たずに表示して、あとで予約変更を確かめる
  const qd = q.get('d'), qp = q.get('p'), qh = q.get('h'), qt = normTime(q.get('t'));
  const hasSched = !!(sched && /^\d{4}-\d{2}-\d{2}$/.test(sched.date || '')) || (S.schedAt > 0);
  if(hasSched){
    // 院内で予約が変わったときの予定（QRコードの内容より新しい）を優先する
    const before = qd ? { d:qd, t:qt } : null;   // 手元のQRコードに書かれた予定
    // β1.5.2：院内からの予定で飲む場所が未選択のときは、手元のQRコードの飲む場所を使う（まだ選んでいない人だけ）
    if(!S.place && (qp === 'home' || qp === 'clinic')) S.place = qp;
    schedChanged = applySched(sched);
    // 初めて開いた人でも、手元のQRコードの日付・時間と違えば知らせる
    if(!schedChanged && !S.cancelled && before && S.date && (before.d !== S.date || (before.t && before.t !== S.examTime)) && !S.schedSeen){ schedChanged = true; }
    if(schedChanged) S.schedSeen = S.schedAt;
    save();
  }else if(qd && /^\d{4}-\d{2}-\d{2}$/.test(qd) && (qp === 'home' || qp === 'clinic')){
    const mth = (qh && (CONFIG.methods[qh] || qh === 'standard')) ? qh : CONFIG.method;
    if(qd !== S.date || mth !== curMethod()){ S.checks = {}; S.drinks = []; S.stools = []; S.delStools = []; S.stopMobi = false; S.allDone = false; S.checkDone = false; S.noStool = false; S.callAck = false; S.curDone = false; S.baseOK = false; S.baseCall = ''; S.extraCall = false; S.extraAck = false; S.lastWaterInProg = false; }
    S.date = qd; S.place = qp; S.method = mth; S.examTime = qt; save();
  }else if(qd && /^\d{4}-\d{2}-\d{2}$/.test(qd)){
    // 検査日と飲み方だけのQRコード（内視鏡カレンダーで「院内／自宅」が未選択のとき）：飲む場所は患者さんが最初の画面で選ぶ
    const mth = (qh && (CONFIG.methods[qh] || qh === 'standard')) ? qh : CONFIG.method;
    if(qd !== S.date || mth !== curMethod()){ S.checks = {}; S.drinks = []; S.stools = []; S.delStools = []; S.stopMobi = false; S.allDone = false; S.checkDone = false; S.noStool = false; S.callAck = false; S.curDone = false; S.baseOK = false; S.baseCall = ''; S.extraCall = false; S.extraAck = false; S.lastWaterInProg = false; }
    S.date = qd; S.method = mth; S.examTime = qt; save();
  }else if(qh && (CONFIG.methods[qh] || qh === 'standard')){
    // 飲み方だけを指定したQRコード：検査日・飲む場所は患者さんが最初の画面で選ぶ
    if(qh !== curMethod()){ S.drinks = []; S.stools = []; S.delStools = []; S.stopMobi = false; S.allDone = false; S.checkDone = false; S.noStool = false; S.callAck = false; S.curDone = false; S.baseOK = false; S.baseCall = ''; S.extraCall = false; S.extraAck = false; S.lastWaterInProg = false; }
    S.method = qh; save();
  }
  if(isEnded() && ((S.drinks || []).length || (S.stools || []).length || (S.delStools || []).length)){   // β1.6.33
    const ck = S.checks; RESET_PROGRESS(); S.checks = ck; save();
  }
  rebuild(); shownDay = ymdOf(new Date());
  sendConsentLog();
  if(S.code) scheduleSync();
  // β1.6.26：番号つきのQRコードで初めて開いたときは、記録の取り扱いへの同意を先に聞く
  const go = () => {
    if(!S.date || !S.place){ resetTo('vSetup'); return false; }
    const f = fromHash(); resetTo(f === 'vConsent' ? 'vSchedule' : f);
    if(schedChanged && !S.cancelled) schedNotice();
    return true;
  };
  if(needConsent() && !S.cancelled){ consentNext = go; resetTo('vConsent'); }
  else if(!go()) return;
  if(!(schedChanged && !S.cancelled) && !/^[A-Z0-9]{3,8}$/.test(qc) && S.code) refreshSched();
  setInterval(() => { if(document.visibilityState === 'visible') refreshSched(); }, 5*60*1000);
  try{ history.scrollRestoration = 'manual'; }catch(e){}

})();
</script>
</body>
</html>
